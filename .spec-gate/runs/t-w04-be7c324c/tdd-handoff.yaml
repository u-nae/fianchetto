non_blocking_notes:
  - finding_id: F-W04-12
    task_id: W04
    note: incompatible은 원인을 직접 확인해서 붙는 범주가 아니라 나머지 모든 실패를 받는 범주다. 그래서 파일 머리는 정상인데 내부가 손상된 저장소, 디스크 I/O 실패, 잠금 경합도 "앱이 모르는 스키마"로 분류된다. 저자가 밝힌 대로 범주는 복구 선택지 문구를 고르는 근거다. 이렇게 잘못 분류되면 사용자는 손상된 데이터를 두고 "앱을 업데이트하라"는 안내를 받게 된다. 시나리오 세 개는 모두 통과하겠지만, 분류의 의미는 테스트로 고정되지 않는다.
  - finding_id: F-W04-13
    task_id: W04
    note: '"파일 없음 → 새로 만듦"과 "파일 있음·열기 실패 → 오류" 사이의 경계 두 가지가 정해져 있지 않다. 첫째, 본 파일이 0바이트로 남은 경우다(예: 첫 생성 중 중단). 파일 머리 검사로는 damaged가 되지만, SQLite는 이 파일을 빈 DB로 열 수 있다. 둘째, 본 파일은 없는데 같은 이름의 -wal·-shm이 남은 경우다. 이를 "파일 없음"으로 보고 새 저장소를 만들면, 남은 -wal을 덮어쓰거나 지울 수 있다. 어느 쪽으로 구현해도 지금 시나리오는 통과한다.'
  - finding_id: F-W04-14
    task_id: W04
    note: '"열기 전에 있던" 파일 묶음을 비교한다고 적은 점은 나아졌다. 하지만 비어 있지 않은 -wal이 반드시 있는 예시는 없다. damaged 예시는 임의 바이트로 채운 본 파일만 만들 가능성이 크다. incompatible 예시는 V2로 저장하고 닫는 동안 WAL이 체크포인트되어 -wal이 비거나 아예 없을 수 있다. 그러면 F-W04-3이 겨냥한 위험, 즉 실패한 열기가 -wal을 지워 최근 트랜잭션을 잃는 경우를 여전히 잡지 못한다.'
  - finding_id: F-W04-15
    task_id: W04
    note: 저장 어댑터가 참조 무결성을 검사하는지 정해져 있지 않다. 검사 대상은 없는 Project를 가리키는 revision, 없는 revision을 가리키는 체크포인트, 다른 Project의 revision이나 없는 revision을 가리키는 Project.currentRevisionID다. 순번 시나리오는 Q를 만들지 않고 Q의 revision을 추가하므로, 검사하지 않는 구현을 전제로 읽힌다. 반면 덮어쓰기 거부 시나리오는 어댑터가 삽입 전에 검사한다고 정한다. 이 경계가 비어 있으면 W05·W22·W25가 어댑터에 기대할 수 있는 보장이 불분명하다.
  - finding_id: F-W04-16
    task_id: W04
    note: F-W04-5에서 요청한 규칙 시나리오는 들어왔지만 두 군데가 남았다. 첫째, Then 문장 끝부분의 주어가 섞여 있다. "schema version이 프로젝트 이름과 같다"로 읽힌다. 의도는 "디코딩한 스냅샷의 프로젝트 이름도 '서비스 B'다"로 보인다. 둘째, 첫 시나리오 표는 여전히 프로젝트 이름과 스냅샷을 서로 다른 입력으로 적고, schema version 열은 적지 않는다. 그래서 revision을 추가하는 API가 이름을 따로 받아도 되는 것처럼 읽힌다.
  - finding_id: F-W04-17
    task_id: W04
    note: 덮어쓰기 거부는 시나리오로 고정됐다. 하지만 어댑터가 Revision과 Checkpoint를 수정하거나 삭제하는 연산을 제공하지 않는다는 점은 assumption에도 구조 검사에도 없다. 어댑터에서 수정이 허용되는 것은 ResourceReference의 북마크·해석 경로, 그리고 W05 커밋과 W10 보관에 필요한 Project 열뿐이어야 한다. 이 범위를 적지 않으면 이후 항목이 편의상 revision 수정 연산을 추가해도 어느 게이트도 잡지 못한다.
  - finding_id: F-W04-18
    task_id: W04
    note: 이전 패스의 지적이 해소됐는지 확인했다. F-W04-1(major)은 해소됐다. 같은 UUID의 revision·Project·참조·체크포인트와 같은 프로젝트의 같은 순번을 거부하고, 레코드 수와 기존 값, 스냅샷 바이트를 단언하는 Outline이 들어왔다. 다른 프로젝트의 같은 순번 허용도 있다. F-W04-2는 해소됐다. V2에 선택 필드를 더하고, 경량 단계를 두고, 운영 열기 경로에 계획을 주입하고, 새 필드가 비어 있음을 단언하며, incompatible을 더 새로운 V2 저장소로 재현한다. F-W04-6(구조로 보장하고, 어긴 저장 레코드는 손상으로 읽음)과 F-W04-7(프로젝트 필터, 삽입 순서와 기록 시각 역전, 정확히 다섯 모델과 Node 없음)도 해소됐다. F-W04-3, F-W04-5는 일부만 해소됐고 F-W04-14, F-W04-16으로 이어진다. 원인 범주가 들어와 F-W04-4의 W04 쪽 요청도 해소됐다. 원인 13종은 W03 ConfigurationEdit의 9개 case 이름(Fianchetto/Domain/ConfigurationEditor.swift)과 0005에 맞는다.
  - finding_id: F-W04-19
    task_id: W04
    note: PRD §7이 요구하는 저장소 열기 실패 복구 선택지 화면은 아직 어느 작업 항목에도 없다. 저자는 이 run의 fingerprint를 지키려고 게이트가 끝난 뒤 W07에 추가하겠다고 적었다. 이 처리는 타당하다. 다만 이것은 caller가 이행해야 할 후속 의무다. W07 details에 범주별 복구 선택지(내보내기 기반 복원 안내, 앱 업데이트 안내, 권한 확인)를 넣을 때 F-W04-12에서 고른 범주 정의를 따라야 한다.
  - finding_id: F-W04-20
    task_id: W04
    note: Services는 SwiftData를 import할 수 없다. 그래서 불변식 5의 한 저장 단위 커밋(revision 추가와 currentRevisionID 이동)과 순번 연속성(누락 방지)은 W05가 Persistence 어댑터의 원자적 연산으로 정해야 한다. W04 어댑터는 같은 순번만 거부하고 순번 사이가 비는지는 검사하지 않는다. 이 배분은 일관되지만, W05 명세가 이를 전제로 삼아야 한다.
