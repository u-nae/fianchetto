non_blocking_notes:
  - finding_id: F-W19-22
    task_id: W19
    note: 비교 중 메뉴 막대 명령 Outline의 Given은 순번 3 이후 무엇이 바뀌었는지 서술하지 않는다. 그런데 예 두 개는 그 변화가 있어야만 존재하는 행을 쓴다. '제거된 "notes.md"' 행은 notes.md가 제거되어야 있고, 'Board 이름' 행은 Board 이름이 바뀌어야 있다. Background 구성만으로는 두 행이 생기지 않는다. 테스트 작성자는 예 열에서 전제를 짐작해 만들어야 한다. 기대 결과는 분명해서 수용 경계는 흔들리지 않는다.
  - finding_id: F-W19-23
    task_id: W19
    note: 과거 구성에서 비교를 열었을 때 과거 구성 띠가 비교 띠와 함께 보이는지, 비교 띠로 가려지는지 정하지 않았다. 띠가 보인다면 그 안의 '현재와 비교' 버튼의 켜짐(보기 메뉴의 같은 명령은 비교 중 꺼짐)과 '현재로 돌아가기' 버튼의 결과도 정해야 한다. '현재 구성으로 돌아가기' 시나리오의 결과는 '비교를 닫는다'로 정해져 있고, 띠 버튼도 16.4에 따라 같은 동작이어야 한다. 그래서 잘못 구현돼도 피해는 작다. 다만 W20이 띠에 '복원…'을 더하면 비교 중 복원 경로가 생길 수 있다.
  - finding_id: F-W19-24
    task_id: W19
    note: 2차 비평의 major 한 건(F-W19-15)과 minor 다섯 건(F-W19-16~20)은 revision 2에서 모두 반영됐다. 비교 중 메뉴 막대 명령 Outline은 '열기'(⌘O)가 원래 선택이 아니라 비교 행에 작동한다는 단언, 행 종류별 켜짐, 숨은 보기 상태를 바꾸는 명령의 꺼짐, 고르지 않은 경우의 꺼짐을 모두 담는다. '현재 구성으로 돌아가기'는 16.4와 같은 결과로 정했다. 현재 구성에서 연 비교에서는 기존 canReturnToCurrent(isViewingPast)가 거짓이므로 따로 정할 필요가 없다. 새 기대값은 W16 규칙으로 다시 따라가 확인했고 모두 일치했다. 최상위에서 "API 명세"를 "문서" 앞으로 옮기면 순서 변경은 "API 명세" 하나다(LIS 동률 시 A에서 앞선 Node 유지). "backend"가 "문서"로 이동하면 "개발" 안의 공통 형제가 하나뿐이라 순서 변경이 생기지 않는다. 그래서 문구는 "이름 변경 · ‘개발’에서 이동 · 대상 교체 · 아이콘 변경"이다. 'Board 보관'·'보관 해제'·'이력 보기'(⌘Y)는 비교 중 켜짐을 정하지 않았다. 다만 셋 다 구성을 바꾸지 않고 보관된 Board에서도 비교할 수 있으므로(0009) 위험은 없다고 본다.
  - finding_id: F-W19-25
    task_id: W19
    note: "'이 기록과 비교'를 메뉴 막대에 두지 않는 예외는 가정에 근거와 기록 계획이 있다. 이력 목록이 단일 선택이라 메뉴 막대에서 고를 수 있는 대상은 지금 보는 구성뿐이고, 그러면 같은 명령은 늘 꺼진다. 대체 경로('현재와 비교'와 대상 메뉴)도 시나리오와 수동 검증 계획으로 확인한다. 정책 질문으로 올릴 만큼 해석이 갈리지는 않는다고 판단했다. 다만 병합 시점까지 DESIGN.md 19.1의 문장은 명세와 반대로 남는다. 이 예외를 handoff의 non_blocking_notes로 넘겨 디자인 세션의 19.1·11.1 갱신을 추적해야 한다."
  - finding_id: F-W19-26
    task_id: W19
    note: 1차 비평의 관찰 두 개가 그대로 남아 있다. 첫째, 최신 revision 대 '현재 구성' 비교가 '같은 구성입니다'가 아니라 '변화 없음'이 된다는 해석은 가정에만 있고 시나리오로 고정되지 않았다. 둘째, 결정표 어휘 Outline(:262)은 결정표 W19.decision.yaml의 사본이다. 그래서 규칙을 바꿀 때 두 곳을 함께 고쳐야 한다.
