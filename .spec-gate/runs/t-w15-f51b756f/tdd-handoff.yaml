non_blocking_notes:
  - finding_id: F-W15-10
    task_id: W15
    note: The late-result rule covers only a Board switch. Inside one Board, a check (selection or "상태 새로고침") that is still resolving the old reference can finish after a same-target recovery or a confirmed replacement has cleared the status. If that result is applied, the row shows a stale "권한 필요"/"대상 없음" for a Bishop that was just fixed, and an access-info refresh from the old check could also be written after the recovery wrote the new bookmark. This does not break a history invariant (access info is outside history), so it is minor.
  - finding_id: F-W15-11
    task_id: W15
    note: After a failed same-target recovery save, the spec doesn't say whether the "권한 필요" status remains, and "그대로 둔다" suggests it should. For a successful same-target recovery, the spec doesn't say whether lastResolvedPath is also updated, as it is for the automatic refresh. Either reading is reversible, but a TDD cycle has to guess both.
  - finding_id: F-W15-12
    task_id: W15
    note: 'The row "권한 필요 + 다른 파일 → 경고 없이" passes only if the shared identity lookup that W09 preview and confirm use also gets the unscoped fallback. Then the existing W09 "연결 대상 변경" flow changes too: for a scope-denied Bishop it moves from 판정 불가 to 다름/같음. That is consistent with 0004, which does not prescribe how identifiers are obtained, and it is planned for record 0012. Whether an unscoped URL yields fileResourceIdentifier/volumeIdentifier under a real sandbox is not shown by injected tests. No change requested. Implement it in the shared lookup, record it in 0012, and include it in the W27 real-environment check.'
