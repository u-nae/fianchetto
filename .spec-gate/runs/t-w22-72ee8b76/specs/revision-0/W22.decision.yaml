schema_version: "1.0"
task_id: W22
decision_id: checkpoint_request_outcome
execution_format: table-v1
# 체크포인트 저장 요청 하나에 대한 서비스의 판정. 위에서 아래로 처음 맞는 규칙(FIRST).
# 순서: 제목(순수 검사, 저장소를 읽지 않는다. W07·W21의 이름 검사와 같다) → Board 존재 → 보관 상태(0009) → revision 확인(존재·소속) → 저장.
# revision_currency는 입력으로 두되 어떤 규칙도 읽지 않는다. PRD §6-G는 "작성 시작 시 연결할 revision을 고정"하므로 저장 대상은
# 고정한 revision이고, 시트가 구성 편집을 막아 화면에서는 고정한 revision이 늘 현재 revision이다. not_current 행이 current 행과 같은
# outcome을 받는 것을 벡터로 증명한다(W21의 source_board_state와 같은 쓰임).
# 저장은 스냅샷을 디코딩하지 않으므로 '읽을 수 없음' 값이 없다. 저장소 읽기 자체의 실패는 outcome이 아니라 오류(throw)다.
hit_policy: FIRST
ordered_rules: true
inputs:
  - name: title
    type: string
    # blank: 앞뒤 공백·줄바꿈을 정리한 뒤 비어 있다. valid: 그 밖의 모든 입력.
    allowed_values: [valid, blank]
    blank_means: any
  - name: project
    type: string
    # not_found: Board ID의 Project가 저장소에 없다.
    allowed_values: [found, not_found]
    blank_means: any
  - name: board_state
    type: string
    # archived: Project.archivedAt이 있다(0005). 보관된 Board는 체크포인트 저장을 거부한다(0009).
    allowed_values: [active, archived]
    blank_means: any
  - name: revision
    type: string
    # found: 그 Board의 revision이다. not_found: 그런 ID가 없다. other_board: 다른 Board의 revision이다.
    allowed_values: [found, not_found, other_board]
    blank_means: any
  - name: revision_currency
    type: string
    # current: 고정한 revision이 Project.currentRevisionID다. not_current: 아니다. 어떤 규칙도 읽지 않는다.
    allowed_values: [current, not_current]
    blank_means: any
outputs:
  - name: outcome
    type: string
    # rejected_blank_title: 제목 없음. rejected_project_not_found: Board 없음. rejected_archived: 보관된 Board(0009).
    # rejected_revision_not_found: revision 없음 또는 다른 Board. saved: 고정한 revision에 체크포인트 하나가 한 저장 단위로 커밋됐고 revision은 늘지 않았다.
    allowed_values: [rejected_blank_title, rejected_project_not_found, rejected_archived, rejected_revision_not_found, saved]
rules:
  - rule_id: R1
    when: {title: blank}
    then: {outcome: rejected_blank_title}
  - rule_id: R2
    when: {project: not_found}
    then: {outcome: rejected_project_not_found}
  - rule_id: R3
    when: {board_state: archived}
    then: {outcome: rejected_archived}
  - rule_id: R4
    when: {revision: [not_found, other_board]}
    then: {outcome: rejected_revision_not_found}
  - rule_id: R5
    when: {revision: found}
    then: {outcome: saved}
default_rule: null
gap_analysis:
  - >-
    입력 2 × 2 × 2 × 3 × 2 = 48 조합. blank 24 조합은 R1. 남은 24 조합 중 not_found Project 12 조합은 R2. 남은 12 조합 중
    archived 6 조합은 R3. 남은 6 조합 중 not_found·other_board revision 4 조합은 R4, found 2 조합(current·not_current 각 1)은 R5.
    빈 칸이 없다(check-decision이 계산한다).
overlap_analysis:
  - >-
    R1은 R2~R5와 blank 행에서 겹치며 FIRST로 R1이 이긴다. 제목은 저장소를 읽기 전에 순수 검사로 거른다(PRD §6-G 제목 필수, W07·W21과 같은 순서).
  - >-
    R2는 R3~R5와 not_found Project 행에서 겹치며 R2가 이긴다. Board가 없으면 보관 상태와 revision 소속을 판정할 수 없다.
  - >-
    R3은 R4·R5와 archived 행에서 겹치며 R3이 이긴다. 보관은 Board 단위 상태라 revision 확인보다 먼저 거른다(0009, PRD §6-C).
  - >-
    R4와 R5는 revision 값이 서로 달라 겹치지 않는다. R5는 revision_currency를 읽지 않으므로 not_current 행도 saved다(PRD §6-G 고정한 revision).
source_locators:
  - docs/PRD.md#g-체크포인트-남기기와-재개
  - docs/PRD.md#c-배치와-제거
  - docs/PRD.md#7-기록-정책과-저장-안정성
  - docs/decisions/0005-provenance-and-archive-fields.md
  - docs/decisions/0009-archived-board-read-only.md
