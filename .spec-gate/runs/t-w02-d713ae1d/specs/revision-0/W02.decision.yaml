schema_version: "1.0"
task_id: W02
decision_id: node_shape_validity
execution_format: review-only
# 위에서 아래로 처음 맞는 규칙 하나를 적용한다. 앞 규칙이 더 근본적인 위반을 먼저 판정한다.
hit_policy: FIRST
ordered_rules: true
inputs:
  - name: parent_kind
    type: string
    # root: 부모 ID가 비어 있음(프로젝트 최상위). 부모 ID가 스냅샷에 없는 경우는 이 표의 입력이 아니다
    # (task-W02.feature "존재하지 않는 부모" 시나리오가 다룬다).
    allowed_values: [root, group, file, folder, webLink]
    blank_means: any
  - name: node_kind
    type: string
    allowed_values: [group, file, folder, webLink]
    blank_means: any
  - name: reference_fields
    type: string
    # complete: referenceID가 있고 recordedPath가 "/"로 시작하는 비어 있지 않은 절대 경로다.
    # none: referenceID와 recordedPath가 둘 다 없다.
    # incomplete: 둘 중 하나만 있거나, recordedPath가 비었거나 절대 경로가 아니다.
    allowed_values: [complete, none, incomplete]
    blank_means: any
  - name: url
    type: string
    # http_or_https: scheme이 http 또는 https(대소문자 무관)이고 host가 비어 있지 않은 절대 URL.
    # other: 값은 있지만 위 조건을 만족하지 않는다.
    allowed_values: [absent, http_or_https, other]
    blank_means: any
outputs:
  - name: verdict
    type: string
    allowed_values: [valid, invalid]
  - name: violation
    type: string
    allowed_values: [none, parent_not_group, missing_reference, incomplete_reference, unexpected_reference, missing_url, invalid_url, unexpected_url]
rules:
  # 부모가 될 수 있는 것은 그룹뿐이다(연결 폴더는 하위 항목의 부모가 아니다, 연결 파일·웹 링크도 마찬가지).
  - rule_id: R1
    when: {parent_kind: file}
    then: {verdict: invalid, violation: parent_not_group}
  - rule_id: R2
    when: {parent_kind: folder}
    then: {verdict: invalid, violation: parent_not_group}
  - rule_id: R3
    when: {parent_kind: webLink}
    then: {verdict: invalid, violation: parent_not_group}
  # 그룹: 실제 경로·참조·URL이 없다.
  - rule_id: R4
    when: {node_kind: group, reference_fields: complete}
    then: {verdict: invalid, violation: unexpected_reference}
  - rule_id: R5
    when: {node_kind: group, reference_fields: incomplete}
    then: {verdict: invalid, violation: unexpected_reference}
  - rule_id: R6
    when: {node_kind: group, reference_fields: none, url: http_or_https}
    then: {verdict: invalid, violation: unexpected_url}
  - rule_id: R7
    when: {node_kind: group, reference_fields: none, url: other}
    then: {verdict: invalid, violation: unexpected_url}
  - rule_id: R8
    when: {node_kind: group, reference_fields: none, url: absent}
    then: {verdict: valid, violation: none}
  # 연결 파일·연결 폴더: referenceID와 기록 당시 경로가 함께 있고 URL은 없다(0003).
  - rule_id: R9
    when: {node_kind: file, reference_fields: none}
    then: {verdict: invalid, violation: missing_reference}
  - rule_id: R10
    when: {node_kind: folder, reference_fields: none}
    then: {verdict: invalid, violation: missing_reference}
  - rule_id: R11
    when: {node_kind: file, reference_fields: incomplete}
    then: {verdict: invalid, violation: incomplete_reference}
  - rule_id: R12
    when: {node_kind: folder, reference_fields: incomplete}
    then: {verdict: invalid, violation: incomplete_reference}
  - rule_id: R13
    when: {node_kind: file, reference_fields: complete, url: http_or_https}
    then: {verdict: invalid, violation: unexpected_url}
  - rule_id: R14
    when: {node_kind: file, reference_fields: complete, url: other}
    then: {verdict: invalid, violation: unexpected_url}
  - rule_id: R15
    when: {node_kind: folder, reference_fields: complete, url: http_or_https}
    then: {verdict: invalid, violation: unexpected_url}
  - rule_id: R16
    when: {node_kind: folder, reference_fields: complete, url: other}
    then: {verdict: invalid, violation: unexpected_url}
  - rule_id: R17
    when: {node_kind: file, reference_fields: complete, url: absent}
    then: {verdict: valid, violation: none}
  - rule_id: R18
    when: {node_kind: folder, reference_fields: complete, url: absent}
    then: {verdict: valid, violation: none}
  # 웹 링크: HTTP/HTTPS URL만 있고 참조·경로는 없다(0002).
  - rule_id: R19
    when: {node_kind: webLink, reference_fields: complete}
    then: {verdict: invalid, violation: unexpected_reference}
  - rule_id: R20
    when: {node_kind: webLink, reference_fields: incomplete}
    then: {verdict: invalid, violation: unexpected_reference}
  - rule_id: R21
    when: {node_kind: webLink, reference_fields: none, url: absent}
    then: {verdict: invalid, violation: missing_url}
  - rule_id: R22
    when: {node_kind: webLink, reference_fields: none, url: other}
    then: {verdict: invalid, violation: invalid_url}
  - rule_id: R23
    when: {node_kind: webLink, reference_fields: none, url: http_or_https}
    then: {verdict: valid, violation: none}
default_rule: null
gap_analysis:
  - >-
    입력 공간 5 × 4 × 3 × 3 = 180 조합. parent_kind ∈ {file, folder, webLink}인 108 조합은 R1~R3이 모두 덮는다.
    parent_kind ∈ {root, group}인 72 조합은 node_kind별로 나뉜다: group 18 = R4·R5(reference complete·incomplete,
    url 무관 12) + R6~R8(reference none × url 3가지 6). file 18 = R9(6) + R11(6) + R13·R14·R17(6). folder도
    R10·R12·R15·R16·R18로 같은 방식 18. webLink 18 = R19·R20(12) + R21~R23(6). 빈 칸이 없어 default_rule은 필요 없다.
overlap_analysis:
  - >-
    R1~R3은 node_kind·reference_fields·url이 any라서 R4~R23과 겹친다. FIRST + ordered_rules로 부모 위반을 먼저
    판정하는 것이 의도다. 부모가 잘못되면 Node 자체의 필드 모양과 상관없이 배치가 불가능하기 때문이다.
  - >-
    R4·R5(그룹의 참조)는 url이 any라 R6·R7과 겹치지 않는다(R6·R7은 reference_fields none으로 한정).
    R9~R12(파일·폴더 참조 누락·불완전)는 url이 any지만 R13~R18은 reference complete로 한정해 겹치지 않는다.
    R19·R20과 R21~R23도 reference_fields로 서로 배타적이다. 즉 R1~R3 이후 규칙끼리는 겹치지 않는다.
  - >-
    한 Node에 위반이 여러 개면(예: 웹 링크인데 참조도 있고 URL도 틀림) 순서상 먼저인 하나만 보고한다.
    Node 하나당 위반 하나를 보고해도 거부라는 결과는 같다.
source_locators:
  - docs/PRD.md#5-핵심-개념과-데이터-규칙
  - docs/PRD.md#불변식
  - docs/PRD.md#a-프로젝트와-연결-만들기
  - docs/TECH_STACK.md#주요-개념
  - docs/decisions/0002-web-links-are-nodes.md
  - docs/decisions/0003-snapshot-records-paths.md
