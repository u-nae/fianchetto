non_blocking_notes:
  - finding_id: F2-W02-1
    task_id: W02
    note: '위반 출처가 셋(결정표, 트리 위반, 이름 위반)인데 한 Node에 둘 이상이 겹칠 때의 보고 규칙이 일부만 정해졌다. (a) missing_parent인 Node는 parent_kind가 없어 결정표 입력이 되지 않으므로, 그 Node의 필드 모양(예: URL이 있는 연결 파일)을 함께 판정하는지 정해지지 않았다. (b) blank_name·untrimmed_name은 "결정표와 별개" 목록에 없어 필드 모양 위반과 함께 보고되는지 알 수 없다. (c) 자기 자신을 부모로 둔 연결 파일은 cycle과 parent_not_group 둘 다 해당한다. 어느 경우든 스냅샷은 거부되므로 수용 경계는 바뀌지 않지만, 위반 목록을 정확히 비교하는 테스트는 구현마다 달라질 수 있다.'
  - finding_id: F2-W02-2
    task_id: W02
    note: reference_fields는 빈 recordedPath를 incomplete로 분류한다고 적었지만, url 입력은 빈 문자열 ""이 absent인지 other인지 정하지 않았다. 웹 링크의 url이 ""이면 missing_url과 invalid_url 중 어느 쪽인지, 그룹의 url이 ""이면 valid인지 unexpected_url인지가 갈린다. JSON 가져오기(W25)에서 실제로 나올 수 있는 값이다.
  - finding_id: F2-W02-3
    task_id: W02
    note: 시나리오가 다른 시나리오의 데이터 표를 참조한다. Gherkin 시나리오는 독립적이어야 하며, 직렬화 시나리오의 표가 바뀌면 이 Outline의 예시 행("backend", "설계 메모", "API 명세", 정렬 순서 2)이 조용히 의미를 잃는다.
  - finding_id: F2-W02-4
    task_id: W02
    note: Gherkin 표 셀은 \n, \\, \| 만 이스케이프로 해석하고 \t·\u{3000}은 문자 그대로 남긴다. 그래서 \n만 \\n으로 적고 \t는 그대로 둔 표기는 결과적으로 일관된 Swift 리터럴 문자열을 만든다. 다만 비대칭이라 테스트 작성 시 혼동하기 쉽다. 수정 요청 없음.
  - finding_id: F2-W02-5
    task_id: W02
    note: 이전 pass의 major(동등성 부정 사례)와 minor 다섯 건이 모두 시나리오·assumption으로 반영되었음을 독립적으로 확인했다. 모든 obligation의 source 앵커가 revision-1 피처의 시나리오 이름과 정확히 일치하고, A14는 순환 시나리오 네 개로 덮이며 그룹 제거 범위·과거 구성 보존 부분은 A14를 함께 가진 다른 작업 항목(W03 등)의 범위다. 필드 모양 Outline 두 개가 결정표 obligation과 중복되는 유지보수 위험(F-W02-7)은 그대로 남아 있다.
