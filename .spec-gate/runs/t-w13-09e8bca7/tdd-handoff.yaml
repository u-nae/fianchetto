non_blocking_notes:
  - finding_id: F-W13-1
    task_id: W13
    note: The manifest assumes a concrete behavior for a stale target (the selected item no longer exists in the current configuration when the user confirms), but no scenario or test obligation makes it testable. The service already rejects with node_not_found (Domain/ConfigurationEditor.swift EditRejection), so the screen-state mapping is the untested part. TDD would leave this branch unspecified.
  - finding_id: F-W13-2
    task_id: W13
    note: Every removal scenario uses reachable targets. Removing a Bishop whose target is missing or unreachable must still succeed without needing file access; no scenario pins that removal does not depend on resolving the target.
  - finding_id: F-W13-3
    task_id: W13
    note: The persistence-failure scenario only removes a single Bishop and does not state the selection after failure. Group removal (multi-node) is the case PRD §7 calls out as one revision, and the success/cancel scenarios specify selection, so the failure path is the only one left ambiguous.
  - finding_id: F-W13-4
    task_id: W13
    note: The fixture names an empty group "보관함" in the same feature that uses "보관된 Board" for the archive state (0009). The shared word invites misreading the empty-group rows as archive behavior when turning scenarios into tests.
  - finding_id: F-W13-5
    task_id: W13
    note: The PRD requires confirmation only for group removal; the spec extends confirmation to Bishop and web-link removal, justified by the absence of Undo (PRD §4). This is a reversible UX choice recorded as an assumption with evidence and does not contradict a baseline rule or decision record. No change requested; the caller may surface it to the user as an informational note.
  - finding_id: F-W13-6
    task_id: W13
    note: A14's cycle-prevention clause is proven by W12 (move), not W13. W13's obligations cover the removal clauses (scope confirmation, history retention). Acceptance coverage in the handoff for A14 should be read together with W12. Counting all descendants (4 for "개발") as "포함된 가상 항목 수" is a reasonable reading consistent with PRD §7 (그룹과 자손 제거).
