questions:
  - question_id: Q-W07-1
    task_id: W07
    blocking: true
    ambiguity: PRD §7은 저장소를 열 수 없을 때 "오류와 복구 선택지를 제공"하라고만 하고 선택지의 내용은 정하지 않았다. 앱이 사용자 데이터 파일을 옮기거나 새 저장소를 만드는지가 선택지에 따라 달라진다.
    evidence: docs/PRD.md#7-기록-정책과-저장-안정성
    question: 저장소를 열 수 없을 때(손상·더 새 버전 앱의 데이터·권한 없음) 화면에서 어떤 복구 선택지를 줄까요?
    options:
      - id: A
        label: 다시 시도·Finder·종료
        detail: 앱은 파일을 옮기거나 새 저장소를 만들지 않는다. PRD §7 "조용히 교체하지 않는다"와 W04의 파일 보존을 그대로 따르고, 사용자가 직접 파일을 옮긴 뒤 다시 시도하면 새 저장소가 생긴다. 백업 복원은 W25 이후 경로다.
      - id: B
        label: 보관 후 새로 시작도 제공
        detail: A에 "기존 저장소를 보관하고 새로 시작"을 더한다. 앱이 기존 파일 묶음을 날짜 붙은 보관 폴더로 옮기고(삭제 없음) 빈 저장소를 만든다. 확인을 받는다. 앱이 사용자 데이터 파일을 옮기는 코드와 부분 이동 실패 처리가 늘어난다.
      - id: C
        label: 손상일 때만 보관 후 새로 시작
        detail: damaged에만 B의 동작을 주고 incompatible은 업데이트 필요, accessDenied는 권한 확인을 안내한다. 새 버전 앱 데이터를 보관 처리하는 실수를 막지만 원인별 분기가 늘어난다.
    recommended_default: A
    recommendation_rationale: 앱이 사용자 데이터를 옮기거나 새 저장소를 만들지 않아 데이터를 잃을 위험이 가장 작고, 나중에 선택지를 더하기 쉽다(되돌리기 쉬움). PRD §7과 W04의 "열 수 없는 저장소는 바꾸지 않는다"와 일치한다.
    answer: A
    answer_source: AskUserQuestion
