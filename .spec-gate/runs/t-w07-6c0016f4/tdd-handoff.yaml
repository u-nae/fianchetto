non_blocking_notes:
  - finding_id: F-W07-9
    task_id: W07
    note: 현재 구성 읽기 실패는 사용자가 직접 선택하는 경로로만 고정되어 있다. 재실행 복원으로 처음 진입한 Board의 현재 구성이 읽히지 않는 경우는 같은 처리를 탄다고 가정할 뿐 시나리오가 없다. Board 목록 읽기 실패 화면의 "다시 시도"가 성공했을 때 목록이 나타나는 경로도 없다.
  - finding_id: F-W07-10
    task_id: W07
    note: 저장소 위치를 알 수 없어 열기에 실패하면(unavailable, 위치 조회 실패) "Finder에서 보기"가 보여 줄 대상이 없다. 명세는 네 원인 모두에서 이 선택지를 보여 준다고 하므로, 대상이 없을 때 선택지를 끌지, 상위 폴더를 보여 줄지가 정해지지 않았다. Q-W07-1 답 A의 범위 안에서 정할 수 있는 화면 처리 세부다.
  - finding_id: F-W07-11
    task_id: W07
    note: A01 시나리오의 다시 열기 단계는 목록과 revision 수(순번 1 하나)만 확인하고, 다시 연 뒤 그 Board의 현재 구성이 Node 없는 구성이라는 점은 확인하지 않는다. 또 Board를 만들어 선택되었을 때 마지막 Board 기록이 바뀐다는 점은 화면 상태 시나리오에 없고 UI 테스트(재실행 후 선택 유지)에만 기대고 있다.
  - finding_id: F-W07-12
    task_id: W07
    note: W07 명세는 A01의 "실제 디렉토리 생성 없이" 부분을 직접 확인하지 않는다. 이 조건은 W05 서비스 obligation이 이미 증명하고 W07은 W05 서비스로 커밋하므로 W07에서 반복할 필요는 작다. 화면 상태 모델이 서비스를 우회하지 않는다는 점은 다시 열기 단계(F-W07-1 해소)로 확인된다.
  - finding_id: F-W07-13
    task_id: W07
    note: Swift 6에서는 async 문맥에서 Thread.isMainThread를 쓸 수 없으므로, 이 obligation은 주입한 동기 저장소 열기 함수 안에서 메인 스레드 여부를 기록하는 방식으로 검증해야 한다. 명세 수정은 필요 없고 TDD 단계에서 참고할 사항이다.
