non_blocking_notes:
  - finding_id: F-W09-2-1
    task_id: W09
    note: 서비스 쪽 재판정 시나리오는 이제 관찰할 수 있다. 확인 때의 판정을 재사용하면 revision이 하나 늘어 테스트가 실패하므로 이전 F-W09-1은 해소됐다. 다만 화면 시나리오는 확인 창에서 "변경"을 골랐는데 재판정 결과가 unchanged인 경우를 다루지 않는다. 확인 창이 닫히는지, 무엇을 안내하는지, 새 경로를 보여 주지 않는지 정해져 있지 않다. 그래서 화면 모델이 unchanged 결과를 성공처럼 처리할 수 있다.
  - finding_id: F-W09-2-2
    task_id: W09
    note: 확인 때 different_target이었는데 확정 시점에 undetermined가 되는 경우가 있다. 이때 다시 확인을 받지 않고 커밋한다는 해석을 지금 명세는 암묵적으로 따른다. 이 해석은 타당하다. 확인 창이 이미 "교체로 기록된다"는 사실을 보여 주므로 PRD §6-B의 알림 취지를 충족하기 때문이다. 하지만 이전 비평에서 요청했는데도 이 해석과 근거가 assumptions에 없다.
  - finding_id: F-W09-2-3
    task_id: W09
    note: 거부 예는 각각 조건을 하나만 쓴다. 새로 생긴 사유 unreachable_target(확정 시 북마크 생성 실패)이 archived·node_not_found· target_kind_mismatch보다 앞서는지 뒤서는지 정해져 있지 않다. W08은 archived를 먼저 판정하고 북마크를 만들지 않으므로, W09도 그 순서를 따른다고 읽는 것이 자연스럽다. 그러나 명세에는 이 순서가 적혀 있지 않다.
  - finding_id: F-W09-2-4
    task_id: W09
    note: 이름이 바뀐 기존 대상의 북마크를 판정 목적으로 해석하면 stale 표시가 나올 수 있다. 판정 과정에서 기존 참조 레코드를 갱신할지는 명세가 정하지 않는다. 다만 assumptions가 이 일을 W15로 넘기고 있고, 어느 쪽이든 revision은 생기지 않는다. 요청하는 변경은 없다.
  - finding_id: F-W09-2-5
    task_id: W09
    note: 이전 지적은 모두 반영됐다. F-W09-1은 재판정 시나리오를 관찰 가능한 unchanged로 바꿔 해소했다. F-W09-2는 임시 디렉토리 표기, F-W09-3은 화면 저장 실패 예와 서비스 revision 수 단언, F-W09-4는 unreachable_target, F-W09-5는 다른 Bishop이 연결한 대상으로 교체하는 시나리오로 해소했다. A03은 W09-replace-keeps-identity와 W09-previous-revision-keeps-target이 직접 증명한다. 두 obligation 모두 A03 조건을 어기면 실패한다.
