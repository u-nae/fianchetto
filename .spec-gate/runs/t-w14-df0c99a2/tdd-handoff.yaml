non_blocking_notes:
  - finding_id: F-W14-8
    task_id: W14
    note: "F-W14-1 is resolved: the scope ordering and closure now have obligations (W14-access-scope-paired, W14-no-scope-when-unreachable). One case is still unstated. The scenario assumes that starting the scope always succeeds. It does not say what happens when starting the scope reports failure. In that case the pairing rule means stop must not be called. Whether the request is still sent, or the failure is classified as 권한 필요, is also left open. A test double that always reports success cannot catch an unconditional stop."
  - finding_id: F-W14-9
    task_id: W14
    note: The launch-rejected path is specified only for a Bishop. A web link open, for example when no default browser handler exists, can also be rejected. The spec does not say whether the same "열지 못했습니다" notice appears for a web link.
  - finding_id: F-W14-10
    task_id: W14
    note: F-W14-5 is resolved by an explicit assumption. The handoff's acceptance_coverage will still list A02 under W14 alone. Ownership of the "복구 동작 표시" branch now depends on a future work-item edit. The edit is correctly deferred, because changing work-items.yaml now would invalidate this run.
  - finding_id: F-W14-11
    task_id: W14
    note: W14 resolves bookmarks but does not persist stale refreshes, and leaves storage to W15. This matches W15's scope and the no-revision invariant, so it is consistent. Until W15 lands, a moved target will re-resolve as stale on every open.
