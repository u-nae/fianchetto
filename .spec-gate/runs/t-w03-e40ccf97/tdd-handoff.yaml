non_blocking_notes:
  - finding_id: F2-W03-1
    task_id: W03
    note: F-W03-2 was fixed in one direction but reopened in the other. Gherkin tags on a Rule are inherited by every scenario under it, so in the Feature all 31 operation scenarios carry @A04, while the manifest lists A04 on only 16 obligations. A test runner that filters or reports by tag will count rejection and replace-target tests toward A04, and the manifest will not. The acceptance boundary is unchanged because the handoff coverage map is built from the manifest. Tracing still depends on which file you read.
  - finding_id: F2-W03-2
    task_id: W03
    note: The precedence that resolves F-W03-4 still leaves two ties open. (a) Reasons joined by "·" are unordered. A replacement with both a relative path and a kind mismatch could return invalid_path or target_kind_mismatch. (b) For a batch where target 1 has a relative path and target 2 has a blank name, the rule "first target's reason" yields invalid_path. Reading the global order across all targets yields blank_name. Both cases are rejected either way, so the A03/A04 boundary does not move. Only exact-reason assertions differ between implementations.
  - finding_id: F2-W03-3
    task_id: W03
    note: Group add and batch add each reject a web-link parent, but web-link add and move do not. Web-link add also has no position-out-of-range row, although the assumptions say every add accepts an optional position. The Rule-level property that every changed result passes W02 validation will catch a web-link parent through W02's parent-must-be-group rule. The exact reason and the position bounds for this operation are still not fixed.
  - finding_id: F2-W03-4
    task_id: W03
    note: "Checked independently. The major finding F-W03-1 is closed: web-link add now rejects invalid_url, blank_name, parent_not_group and node_not_found, and batch add now rejects parent_not_group, node_not_found and invalid_position. Each has an obligation. The minor findings are closed as follows. F-W03-3: the identity outline now has all 9 combinations, including (different, unavailable), and they match decision table R1-R5 under FIRST. F-W03-5: the missing-destination, missing-URL-target and missing-rename-target rows are present, and a linked item moved under itself returns parent_not_group, consistent with the stated precedence. F-W03-6: an identifier-pair-to- comparison mapping obligation exists, matching 0004's pure-function rule. Position bounds in every example match the assumption (0…n excluding the moved node). The operation-level rule that an empty URL is invalid_url is consistent with PRD §6-A (HTTP/HTTPS URL) and 0002. It does not settle W02's open validator classification of \"\", and it does not need to. No change requested."
