non_blocking_notes:
  - finding_id: F-W05-R2-1
    task_id: W05
    note: access_mismatch가 거부 순서 목록에 없다. 그래서 두 가지가 정해지지 않는다. 첫째, 같은 대상 재선택 교체에 북마크 바이트가 없을 때 결과가 unchanged인지 access_mismatch인지 갈린다. W03 결과를 먼저 보면 unchanged이고, 요청 형태를 먼저 보면 access_mismatch다. 같은 대상 시나리오의 When은 바이트를 주는지 말하지 않는다. 둘째, 보관된 Board나 없는 Board에 바이트 수가 어긋난 요청이 오면 어느 사유가 나오는지 정해지지 않는다. assumption의 규칙("대상 수"는 요청의 대상 수)을 그대로 읽으면 같은 대상 교체에도 바이트 하나가 필요하다. 따라서 두 시나리오가 직접 충돌하지는 않는다. 다만 테스트 작성자가 입력을 고르는 방식에 따라 기대값이 달라질 수 있다.
  - finding_id: F-W05-R2-2
    task_id: W05
    note: 이 시나리오는 정상 저장 경로에서 새 참조 레코드가 생기고 이전 레코드가 보존되는지를 본다. 저장 실패 조건은 없다. 내용상 A03과 불변식 3에 해당하지만, A03은 W05의 acceptance_refs에 없다. A13 태그 때문에 acceptance_coverage가 A13 증거를 실제보다 넓게 보고한다. A13은 다른 실패 시나리오들이 이미 충분히 덮는다.
  - finding_id: F-W05-R2-3
    task_id: W05
    note: 우선순위 문장은 생겼다. 하지만 시나리오는 보관된 Board에 W03이 거부할 편집을 보내는 경우만 다룬다. 보관된 Board에 무변경 편집(같은 이름으로 바꾸기)을 보내면 문장대로는 archived 거부다. 이 경우를 고정하는 시나리오는 없다. W03 결과를 먼저 계산하고 changed일 때만 보관 여부를 확인하는 구현도 이 시나리오를 통과한다.
  - finding_id: F-W05-R2-4
    task_id: W05
    note: W03은 undetermined를 different_target처럼 처리해 새 referenceID를 만든다. W05의 참조 레코드 저장 규칙은 새 referenceID를 기준으로 하므로 같은 경로로 처리된다. 따로 고칠 것은 없다. 원하면 교체 시나리오를 identity 두 값 (different_target, undetermined)의 Outline으로 둘 수 있다.
  - finding_id: F-W05-R2-5
    task_id: W05
    note: 이전 major 두 건은 source 근거로 닫혔다. F-W05-1은 참조 레코드를 같은 저장 단위로 저장하는 방식으로, F-W05-2는 같은 서비스 안의 Project 목록과 이어진 성공 커밋, 재오픈 후 상태를 함께 단언하는 방식으로 닫혔다. minor F-W05-3·5·6·7과 note F-W05-8도 반영됐다. F-W05-4는 일부만 반영됐다(F-W05-R2-3 참고). 남은 항목은 acceptance 경계를 바꾸지 않는다.
