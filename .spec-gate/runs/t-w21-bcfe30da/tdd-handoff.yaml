non_blocking_notes:
  - finding_id: F-W21-10
    task_id: W21
    note: "1차 비평이 요청한 변경 다섯 건이 모두 원문 근거와 함께 반영됐고, obligation description이 시나리오 본문과 다시 일치한다. 요청 변경이 없던 F-W21-5(Background 순번 4의 원인 묶음)·F-W21-9(결정표 확인)는 그대로 두었고 F-W21-7은 가정으로 남겼다. 회귀는 없다: 결정표 W21.decision.yaml은 revision-0과 바이트 동일하고, 벡터 파일은 table 경로만 revision-1로 바뀌었다."
  - finding_id: F-W21-11
    task_id: W21
    note: 인간 답 A가 Feature 머리글·'참조' 절·가정·결정표 출력 정의·의존 시나리오 일곱 곳에 같은 뜻으로 반영됐고, 서로 모순되는 문장이 남아 있지 않다. 답이 권장안과 같아 revision-0의 본문은 바뀌지 않았고 표기만 "권장안 기준"에서 "확정"으로 바뀌었다. 미답 질문이 없으므로 author_status 전환도 맞다. 게이트 종료 뒤 이 답을 docs/decisions/로 옮기는 일은 통합 절차대로 handoff 이후에 한다.
  - finding_id: F-W21-12
    task_id: W21
    note: 결정표 완전성·겹침·벡터 최신성·Gherkin 구문·obligation 양방향 대응을 산출물로 확인했다. source_revision에 읽기 실패 값(unreadable)과 규칙(R4)이 있고, 만들기는 참조 레코드를 읽지 않으므로(Q-W21-1=A) 참조 읽기 실패 입력이 없는 것이 맞다. Project 레코드 손상은 W20 board_state와 같은 관례로 표 밖의 저장소 오류다. A09(새 ID·구조와 연결 유지·원본과 독립)는 W21-new-ids-remapped, W21-confirm-creates-board, W21-source-preserved, W21-independent-editing, W21-remap-preserves-structure가 각각 깨지면 실패하는 단언으로 증명한다.
  - finding_id: F-W21-13
    task_id: W21
    note: 1차 F-W21-5와 같다. 실제 편집으로는 addGroup 한 revision이 웹 링크·Bishop을 함께 더하지 못한다. fixture를 저장소에 직접 넣는 테스트에는 영향이 없고 시나리오 기대값도 맞지만, 이 Background를 UI 테스트에서 실제 편집으로 재현하면 revision 수(5)와 순번이 달라진다. 수용 경계와 무관하다.
  - finding_id: F-W21-14
    task_id: W21
    note: 기본 이름 '<당시 이름> 사본'은 사이드바의 현재 이름과 다를 수 있다는 1차 참고 사항을 가정 12로 받아 디자인 세션 몫으로 넘겼다. 사용자가 이름을 입력하므로 데이터 의미는 바뀌지 않고 되돌리기 쉬워 정책 질문이 아니다. 다만 디자인 세션이 '현재 이름'으로 정하면 :31·:61·:95·:167 네 곳의 기대값 "서비스 알파 사본"이 "서비스 A 사본"으로 바뀌므로 구현 전에 확정하는 편이 TDD 왕복을 줄인다.
  - finding_id: F-W21-15
    task_id: W21
    note: 1차 F-W21-4가 요청한 대로 양방향이 고정됐다. 그 결과 파일 메뉴 '이 구성으로 복원…'의 켜짐 조건 하나(만들기 시트 열림 → 꺼짐)가 W20 명세가 아니라 W21 명세에만 있다. 모순은 아니고 조건이 늘어난 것뿐이지만, 같은 명령의 켜짐 규칙이 두 작업 항목에 나뉘어 있으므로 W20 명세를 다음에 고칠 일이 있으면 outline에 같은 행을 더하는 것이 유지보수에 낫다. 지금 W21에서 고칠 것은 없다.
