questions:
  - question_id: Q-W21-1
    task_id: W21
    blocking: true
    ambiguity: >-
      PRD §6-F는 새 프로젝트의 "연결 참조는 같은 로컬 대상과 접근 정보를 사용할 수 있다"고만 한다. 원본 revision이 기록한 ResourceReference 레코드를 새 Board의 Node가 그대로 가리킬지(공유), 같은 북마크 데이터로 새 참조 레코드를 만들어 가리킬지(복제)를 정하지 않았다. 참조 레코드의 북마크·마지막 해석 경로는 운영 정보라 revision과 분리되어 갱신되므로(0003, 0007, 불변식 8), 공유하면 한쪽 Board에서 한 접근 정보 갱신(stale 북마크 갱신, 권한 복구)이 다른 Board에서도 보이고, 복제하면 Board마다 따로 복구해야 한다. 대상 교체는 어느 쪽이든 새 참조를 만들므로(불변식 3) 상대 Board에 영향이 없다.
    evidence: docs/PRD.md#f-복원과-새-프로젝트-만들기; docs/PRD.md#5-핵심-개념과-데이터-규칙; docs/decisions/0003-snapshot-records-paths.md; docs/decisions/0007-current-configuration-is-revision-pointer.md
    question: 과거 구성으로 만든 새 Board의 연결 항목은 원본과 참조 레코드를 공유할까요, 같은 북마크로 새 참조 레코드를 만들까요?
    options:
      - id: A
        label: 참조 레코드 공유
        detail: >-
          새 Board의 Node는 원본 revision이 기록한 참조 ID를 그대로 쓰고 새 참조 레코드를 만들지 않는다. W20 복원이 기록된 참조를 그대로 쓰는 것과 같고, 0007(참조는 revision과 분리된 운영 레코드)·불변식 8·10에 기댄다. 한쪽에서 같은 대상의 접근 정보를 복구하면 다른 쪽도 함께 복구된다(같은 실제 대상이므로 이득). 대상 교체는 새 참조라 상대 Board를 바꾸지 않는다(불변식 3). 비용: 없음. 참조 레코드가 어느 Board에도 속하지 않는 설계는 이미 그렇다.
      - id: B
        label: 같은 북마크로 새 참조 레코드 복제
        detail: >-
          원본 참조의 북마크 데이터·최초 경로·종류를 복사한 새 참조 레코드를 만들고 Node의 참조 ID도 새 값으로 재매핑한다. 두 Board의 접근 정보가 완전히 독립된다. 비용: Domain 재매핑이 참조 ID까지 다루고 서비스가 참조 레코드를 읽어 복제하며, 참조 레코드 수가 늘고, stale 북마크를 Board마다 따로 다시 선택해야 하며(0012), 내보내기(W24)에 같은 대상의 참조가 중복된다. 되돌리려면 데이터 이전이 필요하다.
    recommended_default: A
    recommendation_rationale: >-
      PRD §6-F의 "같은 로컬 대상과 접근 정보를 사용할 수 있다"는 공유로 읽히고, 참조 레코드는 이미 revision과 분리된 운영 정보라 어느 Board의 것도 아니다(0003, 0007). W20 복원도 기록된 참조를 그대로 쓴다. A는 새 레코드·새 매핑이 없어 가장 작고, 사용자에게는 한 번의 접근 복구가 두 Board에 함께 적용되어 유리하다. 나중에 B가 필요해져도 새로 만드는 Board부터 적용하면 되어 되돌리기 쉽다.
    answer: A
    answer_source: AskUserQuestion
