      0020 초안은 "보기 방식과 현재 위치는 Board별 화면 설정"이라 적었고, DESIGN.md 17.1은 "마지막 보기 방식을 기억한다(앱 전체)"라 적었다.
      보기 방식과 아이콘 보기 위치를 무엇 단위로, 다시 실행 뒤에도 기억하는지가 서로 다르다.
