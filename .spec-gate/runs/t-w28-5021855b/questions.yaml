    question: 아이콘 보기/목록 보기 선택과 아이콘 보기의 현재 위치를 어떻게 기억할까요?
    options:
      - id: A
        label: Board별 보기, 위치는 세션만
        detail: Board마다 마지막 보기 방식을 다시 실행해도 기억한다. 위치는 앱을 쓰는 동안만 두고 Board 전환·다시 실행 때 최상위로 시작한다.
      - id: B
        label: Board별 보기와 위치 모두 기억
        detail: 다시 실행해도 Board별 보기와 보던 Wing으로 돌아간다. 없어진 Wing 처리와 오랜만에 열 때 혼란이 늘어난다.
      - id: C
        label: 앱 전체 보기 하나, 위치는 세션만
        detail: DESIGN 17.1의 현재 내용. 가장 단순하다.
    recommended_default: A
    recommendation_rationale: Board마다 구조가 달라 보기 선호가 다를 수 있고, 깊은 위치 복원은 혼란과 예외 처리를 늘린다.
    answer: A
