non_blocking_notes:
  - finding_id: F-W28-21
    task_id: W28
    note: The switch keeps the selection, but the no-check scenario starts with nothing selected. An implementation that checks the selected Bishop again when the view changes would still pass. That is the case where the rule matters.
  - finding_id: F-W28-22
    task_id: W28
    note: "The assumption adds Back history entries for location moves caused by a view switch. DESIGN 17.5 in #33 does not list them, and no scenario shows them. The Back-to-removed-Wing scenario works only because its switch does not move the location. Two readers could therefore build different Back histories."
  - finding_id: F-W28-23
    task_id: W28
    note: For app-internal drops, rejection is shown only on a file Bishop tile. The folder-Bishop invariant is covered only for Finder drops. An implementation that treats a folder Bishop tile like a Wing for app-internal moves would pass. The W12 move rule lowers the risk, but this task does not show it.
  - finding_id: F-W28-24
    task_id: W28
    note: The obligation says the scenario proves web links stay unchanged under the file-type setting. The Examples table has no web-link row.
  - finding_id: F-W28-25
    task_id: W28
    note: On an editable Board, the scenarios for enter, up, Back, and the path bar never check that the revision count stays the same. The only navigation check runs on an archived Board, where nothing can be recorded anyway. An implementation that records location changes would fail only the view-mode relaunch scenario, and only by accident.
  - finding_id: F-W28-26
    task_id: W28
    note: "The major finding F-W28-12 is closed. The switch rule (selection's parent, otherwise the session location, otherwise the top level) is now stated once, cited to Q-W28-1, and gets a no-selection example that uses an earlier location. The fallback rows and the Back-to-removed-Wing Given follow it. F-W28-13 is closed: the fallback target \"개발\" now differs from the current location, the top level. F-W28-14, -15, -16, -17, and -18 are closed: @A04 on cancel, a Back-disabled row for list view and Board switch, the post-gate work-item alignment recorded in assumptions[0], the empty-Wing arrow scenario, and the step that says it replaces the Background."
  - finding_id: F-W28-27
    task_id: W28
    note: Carried over from F-W28-20. A02 is proven only as "the open request leaves from the icon view". Relaunch access and the recovery display stay with W14 and W15. This is acceptable for a view-level task.
  - finding_id: F-W28-28
    task_id: W28
    note: "The accepted specification matches DESIGN 17 only in PR #33. On this branch, DESIGN 17.1 (\"앱 전체\") and 17.4 (an empty-space drop moves the item) still disagree, and so do the W28 work-item details and 0020 (location per Board). The manifest records that these will be aligned after the gate. Changing work-items.yaml or 0020 invalidates this run's fingerprint, so make those changes after the handoff, as integration.md requires. Make sure #33 merges before the TDD cycle reads DESIGN 17."
