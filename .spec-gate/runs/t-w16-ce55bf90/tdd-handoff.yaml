    note: '이전 지적의 해소를 확인했다. F-W16-1: 같은 이름·경로 재추가와 같은 이름 형제 두 시나리오(@A07)와 obligation 추가. F-W16-3: 최상위 "위키"로 빈 경로 관찰 가능. F-W16-4: 고정 구성 B 사용. F-W16-5: 앞쪽 추가와 맞바꿈 결합 예시 추가. 순서 변경 예시 4개, 결합 예시, 맞바꿈 예시, 결과 순서 예시("backend", "위키", "API 명세")를 가정의 최장 증가 부분열·사전순 동점 규칙과 전위 순회 규칙으로 직접 계산해 모두 일치함을 확인했다. A07의 분류 6종과 인덱스 밀림 규칙은 실패할 수 있는 obligation으로 덮인다.'
