non_blocking_notes:
  - finding_id: F-W18-1
    task_id: W18
    note: 모든 과거 항목 시나리오가 현재 구성에도 같은 UUID로 남아 있는 Node만 쓴다. 지금의 서비스는 현재 구성에서 Node를 찾으므로, 과거에만 있는 Node(이후 제거된 Bishop)를 열거나 Finder에서 보기·상태 확인·다시 선택하면 notApplicable·nil·nodeNotFound로 조용히 끝난다. R1/R2 시나리오가 "과거 Node를 넘긴다"는 방향은 강제하지만, 현재 구성에 없는 Node의 경로는 어느 시나리오도 확인하지 않는다.
  - finding_id: F-W18-2
    task_id: W18
    note: 세 시나리오의 전제가 Background의 revision 표와 맞지 않는다. 순번 2에 웹 링크가 없고, 첫 시나리오는 순번 2 항목이 "backend", "개발"뿐이라고 단정한다. 용도를 data로 바꾸면 revision이 하나 더 생겨야 하지만(0021) 현재 revision은 순번 4이고 원인은 addGroup이다. 테스트 작성자가 전제 데이터를 임의로 맞춰야 한다.
  - finding_id: F-W18-3
    task_id: W18
    note: 보관된 Board의 과거 화면에서 다른 대상·판정 불가로 다시 선택하면 보관 안내와 과거 구성 안내 중 어느 것을 보이는지 시나리오가 없다. 두 안내 모두 아무것도 바꾸지 않으므로 정책 차이는 아니지만, 지금 서비스는 보관 거부를 먼저 돌려주므로 화면 문구가 갈린다.
  - finding_id: F-W18-4
    task_id: W18
    note: 과거 화면의 다시 선택에서 접근 정보 저장이 실패하거나 사용자가 고르기를 취소하는 경우, 그리고 과거 모드의 '상태 새로고침'이 과거 구성의 참조를 확인하는지가 assumption에만 있고 시나리오·obligation이 없다. 특히 상태 새로고침은 지금 서비스가 현재 구성을 읽으므로 그대로 두면 과거 모드에서 현재 구성의 상태가 섞인다.
  - finding_id: F-W18-5
    task_id: W18
    note: "\"표준화\"의 범위가 끝 '/' 하나로만 드러난다. macOS에서 기록 경로가 /var/...이고 북마크 해석 결과가 /private/var/...처럼 심볼릭 링크가 풀린 형태로 돌아오면, 같은 위치인데 '당시와 다른 위치'가 붙을 수 있다(테스트 임시 디렉토리가 바로 이 경우다). 대소문자 차이도 같은 문제다. Domain 순수 함수의 입력 규칙이 정해지지 않으면 테스트가 환경에 따라 달라진다."
  - finding_id: F-W18-6
    task_id: W18
    note: 모드가 바뀔 때 고른 항목이 남는 경우, 그 항목의 상태 확인과 '고른 항목' 카드의 현재 위치 해석이 일어나는지 정해지지 않았다. 상태 시나리오는 현재로 돌아간 뒤 남아 있는 "backend"를 "확인 전"으로 기대하므로 "남은 선택은 확인하지 않는다"로 읽히지만, 과거로 들어갈 때 남은 선택의 카드가 현재 위치를 보이는지는 알 수 없다.
  - finding_id: F-W18-7
    task_id: W18
    note: 작업 항목이 명시한 "세 곳 모두 꺼짐"이 인스펙터 하나로만 확인되고, 메뉴 막대는 읽기 전용 시나리오의 일반 문구("아이콘 고르기")에 묻혀 있다.
