non_blocking_notes:
  - finding_id: F-W08-9
    task_id: W08
    note: 화면 저장 실패 시나리오는 안내·다시 시도·revision 수 불변만 단언한다. 이전 critic F-W08-6이 요청한 "트리가 이전 구성을 유지한다(design.md가 트리에 보이지 않는다)"와 "완료 표시가 없다"는 단언이 빠져, 화면 모델이 서비스 결과를 기다리지 않고 트리를 낙관적으로 갱신하는 구현도 통과할 수 있다. 서비스 시나리오(줄 68-71)가 저장소 쪽 원자성은 이미 증명하므로 경미하다.
  - finding_id: F-W08-10
    task_id: W08
    note: 시나리오 이름은 "같은 Board"를 약속하지만 단계는 트리 항목 선택만 바꾼다. 실패 안내가 떠 있는 동안 다른 Board를 선택한 뒤 다시 시도하는 경우(안내가 남는지, 원래 Board에 연결되는지)는 증명되지 않는다. 가정이 동작을 정했으므로 정책 질문은 아니다.
  - finding_id: F-W08-11
    task_id: W08
    note: 줄 85의 "선택돼 있다"는 Board 선택을 뜻하지만 웹 링크 선택으로도 읽힌다(다음 단계가 트리 선택을 따로 정하므로 테스트에는 영향이 작다). 실패 안내는 실패 대상 이름만 단언하고 원인(대상 없음 등)의 표시는 정하지 않았다. 원인별 상태 표시는 PRD §6-H 항목(W14 등)의 범위로 보이므로 수정 요구는 없다. 이전 F-W08-1~F-W08-7은 revision-1에서 해소되었다.
