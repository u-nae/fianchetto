non_blocking_notes:
  - finding_id: F-W20-11
    task_id: W20
    note: "작성자가 적용했다고 주장한 일곱 건을 산출물로 확인했다. F-W20-1: 결정표 입력 영역에 target_revision=unreadable이 들어가 R3이 4칸을 이기고 check-decision 결과 빈 칸이 없다. R2(not_found·other_board)와 R3(unreadable)은 값이 달라 겹치지 않고, 서비스 시나리오와 outline 예시가 \"빈 구성으로 대신하지 않는다\"를 고정한다. 해소. F-W20-2: 복원 직후 해석 없음을 단언한 뒤 항목 선택을 When으로 두어 확인 시점이 W15 규칙과 같아졌고 헤더·가정 3도 맞췄다. 해소. F-W20-3: 순번 5(현재 revision) 행을 대상으로 바꿔 Background와 모순이 없다. 해소. F-W20-4: 19.3 어휘 '대상 교체'와 값 순서를 적었다. 해소. F-W20-5: 순번 6을 실제로 고르는 단계가 있어 제목이 검증된다. 해소. F-W20-6: 시트 상태와 재시도 경로를 정했다. 해소. F-W20-7: 키보드·접근성 시나리오를 더했다. 해소. F-W20-9는 가정 9와 표 주석으로, F-W20-10은 두 답(A·A)으로 닫혔고 revision-1의 '진입'· '차이 확인' 절은 답 A·A(복원 전용 시트, 파일 메뉴)와 일치한다. F-W20-8(순번 2 fixture가 Bishop과 Wing을 함께 더함)은 바뀌지 않았으나 원래 수정 요청이 없던 참고 사항이다. 블로킹 질문은 남아 있지 않다."
  - finding_id: F-W20-12
    task_id: W20
    note: revision-1로 다시 쓰는 과정에서 obligation 설명이 잘렸다. 시나리오 본문(task-W20.feature:99-106)과 source 로케이터는 온전하므로 수용 경계는 바뀌지 않지만, handoff와 spec-brief가 이 설명을 그대로 옮기므로 TDD 담당자가 보는 obligation 목록에 의미가 끊긴 문장이 남는다.
  - finding_id: F-W20-13
    task_id: W20
    note: outline 제목의 뒷부분("같은 시트를 연다")은 그 outline의 단계가 검증하지 않고 바로 다음 시나리오(:54)가 검증한다. obligation 설명은 단계와 맞으므로 TDD 방향은 바뀌지 않는다.
  - finding_id: F-W20-14
    task_id: W20
    note: 한 When에 두 입력 경우를 '또는'으로 묶어 시나리오 하나가 두 동작을 말한다. 결정표 R2의 per-rule obligation이 not_found와 other_board를 각각 벡터로 분리하므로 테스트 경계는 손상되지 않는다. revision-0부터 같은 형태였고 pass 1에서도 요청하지 않았다.
  - finding_id: F-W20-15
    task_id: W20
    note: "'닫기'만 있는 변형 시트의 Esc·Return 동작은 적혀 있지 않다. 버튼이 하나뿐이라 Esc와 Return이 모두 '닫기'인 macOS 기본 관례 외의 해석이 없고, revision을 만들지 않는 조회 경로라 수용 경계와 무관하다."
