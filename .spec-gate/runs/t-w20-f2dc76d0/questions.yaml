questions:
  - question_id: Q-W20-1
    task_id: W20
    blocking: true
    ambiguity: >-
      PRD §6-F는 복원이 "현재와의 차이를 먼저 보여 준다"고만 하고, 어떤 화면으로 보여 주는지 정하지 않았다. DESIGN.md 16.3은 '이 구성으로…' 메뉴의 '복원…'(줄임표 = 확인 단계가 있음)만 둔다. W19 비교 화면(0024·0027)을 재사용할지, 복원 전용 확인 시트를 둘지에 따라 차이의 표시 방향(이전/이후), 확정 버튼의 위치, 0027이 정한 비교 띠의 의미가 달라진다.
    evidence: docs/PRD.md#f-복원과-새-프로젝트-만들기; docs/decisions/0024-compare-view.md; docs/decisions/0027-compare-view-rules.md
    question: "'복원…'을 고른 뒤 현재와의 차이를 어떤 화면에서 확인하고 확정할까요?"
    options:
      - id: A
        label: 복원 전용 확인 시트
        detail: >-
          시트에 요약(0027 규칙: '변화 N개 · Board 이름 변경')과 W19 변화 문구의 변경 목록을 보이고 이전=현재 구성, 이후=복원 결과(#n)로 둔다. '취소'·'복원' 버튼. 현재와 같으면 '현재와 같은 구성입니다'와 닫기만 둔다. 0024·0027은 그대로 두고 W16 차이와 19.3 변화 문구를 재사용한다. 비용: 시트 하나를 새로 만든다.
      - id: B
        label: W19 비교 화면을 열고 비교 띠에 '복원' 버튼
        detail: >-
          '복원…'이 비교(#n ↔ 현재)를 열고 비교 띠에 '복원' 버튼을 더한다. 화면을 새로 만들지 않지만 0027의 "이전=순번이 작은 쪽" 규칙과 복원의 방향 (현재 → 과거)이 어긋나고, 조회 전용이던 비교 띠에 구성을 바꾸는 버튼이 들어가 0027의 비교 중 명령 규칙을 고쳐야 한다.
      - id: C
        label: 요약만 있는 확인 창
        detail: >-
          '변화 N개 · Board 이름 변경' 한 줄과 '취소'·'복원'만 있는 알림 창. 가장 작지만 어느 항목이 바뀌는지 보이지 않아 PRD §6-F의 "차이를 먼저 보여 준다"를 최소로만 만족한다.
    recommended_default: A
    recommendation_rationale: >-
      복원은 현재 → 과거 방향의 변화를 확인하는 일이라 0027의 이전/이후 규칙과 반대이고, 비교 화면은 조회 전용으로 설계되었다(0027 비교 중 명령 규칙). A는 기존 결정을 건드리지 않고 W16 차이·19.3 변화 문구·0027 요약 규칙을 그대로 재사용하며, 시트가 닫히면 흔적이 남지 않아 되돌리기 쉽다.
    answer: A
    answer_source: AskUserQuestion
  - question_id: Q-W20-2
    task_id: W20
    blocking: true
    ambiguity: >-
      CLAUDE.md는 모든 기능을 메뉴·키보드로 접근할 수 있어야 한다고 하고, 0018은 명령을 네이티브 메뉴 막대에 두되 0027의 '이 기록과 비교'처럼 "메뉴 막대에 대상이 없는" 명령만 예외로 한다. DESIGN.md 16.3은 띠의 '이 구성으로…' 메뉴만 적고 메뉴 막대 자리를 정하지 않았다. 복원은 보고 있는 과거 구성이 곧 대상이라 메뉴 막대에 둘 수 있는데, 어느 메뉴인지(구성을 바꾸는 파일 메뉴 vs 비교와 같은 보기 메뉴)와 둘지 말지가 정해지지 않았다.
    evidence: docs/decisions/0018-native-menus-and-keys.md; docs/decisions/0027-compare-view-rules.md; docs/DESIGN.md#163-과거-구성-띠
    question: "'이 구성으로 복원…'을 메뉴 막대 어디에 둘까요?"
    options:
      - id: A
        label: 파일 메뉴 '이 구성으로 복원…'
        detail: >-
          과거 구성을 볼 때만 켜지고(비교 중·보관된 Board·현재 구성에서는 꺼짐) 띠의 '복원…'과 같은 시트를 연다. macOS 앱의 '파일 › 되돌리기' 관례와 같고, 구성을 바꾸는 명령을 보기 메뉴(조회)와 구분한다. 비용: 파일 메뉴 항목 하나와 켜짐 조건.
      - id: B
        label: 보기 메뉴에 '현재와 비교' 옆
        detail: >-
          0027이 '현재와 비교'를 보기 메뉴에 둔 것과 나란히 둔다. 찾기 쉽지만 보기 메뉴에 구성을 바꾸는 명령이 들어가 메뉴 성격이 섞인다.
      - id: C
        label: 메뉴 막대에 두지 않음
        detail: >-
          띠의 '이 구성으로…' 메뉴만 둔다. 0027의 '이 기록과 비교' 예외와 같은 취급이지만, 그 예외의 근거("메뉴 막대에 대상이 없다")가 복원에는 맞지 않아 0018을 어긴다.
    recommended_default: A
    recommendation_rationale: >-
      복원은 대상(보고 있는 과거 구성)이 분명해 0018의 메뉴 막대 원칙을 적용할 수 있고, 데이터를 바꾸는 명령이므로 조회 명령이 모인 보기 메뉴보다 파일 메뉴가 맞다. 켜짐 조건은 W18·W19의 '현재 구성으로 돌아가기'·'현재와 비교'와 같은 방식으로 구현되어 비용이 작다.
    answer: A
    answer_source: AskUserQuestion
