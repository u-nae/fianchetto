non_blocking_notes:
  - finding_id: F-W11-P2-1
    task_id: W11
    note: '실제 저장소가 같은 임시 디렉토리에 있으면 첫 쓰기에서 저장소 보조 파일(예: -wal, -shm)이 생길 수 있어 이 Then은 거짓이 되거나, 테스트 작성자가 저장소 파일을 임의로 제외해 공허해질 수 있다. A01의 "실제 디렉토리 생성 없음"을 증명하는 관찰 대상이 모호하다.'
  - finding_id: F-W11-P2-2
    task_id: W11
    note: 웹 링크 추가 위치 Outline에 Bishop 폴더 "backend" 선택(→ 그룹 "개발")과 웹 링크 선택(→ 최상위) 예가 없다. 그룹 추가와 같은 규칙이라는 가정이 웹 링크 추가에는 검증되지 않는다. 도메인이 parent_not_group으로 막으므로 데이터 불변식은 깨지지 않지만, 화면에서 거부 안내가 뜨는 구현이 통과한다.
  - finding_id: F-W11-P2-3
    task_id: W11
    note: '웹 링크가 선택돼 있으면 네 명령의 다른 시작 조건이 모두 충족되므로, 괄호 속 우선순위 주장은 어떤 예로도 실행되지 않는다. 종류 검사를 먼저 하는 구현(예: 보관된 Board에서 그룹 선택 후 "URL 변경" → 조용히 무시)도 통과한다. 또한 W10과 달리 revision 수 불변 Then이 없다.'
  - finding_id: F-W11-P2-4
    task_id: W11
    note: 단축키와 "이름 변경 창은 현재 이름으로 채워 연다"는 가정에만 있고 시나리오로 고정되지 않았다. 기존 명령과 충돌은 없다(⌘N, ⇧⌘A, ⇧⌘R). 메뉴 자체가 키보드로 접근 가능하므로 수정 요청은 없다.
  - finding_id: F-W11-P2-5
    task_id: W11
    note: 저장 진행 중 재확정(빠른 두 번 확정)의 기대 동작은 여전히 명세되지 않았다. W05 직렬화로 데이터 불변식은 지켜지나 그룹이 두 개 생길 수 있다. 구현 시 저장 중 확정 비활성화를 고려할 만하다.
