questions:
  - question_id: Q-W17-1
    task_id: W17
    blocking: true
    ambiguity: >-
      PRD §6-D는 "선택 시점 이하의 기록 중 마지막"을 고르라고 하지만, '날짜로 찾기'의 시각 선택이 분 단위(행의 시각 표시도 "오후 2:20" 분 단위)일 때
      고른 "오후 2:20"이 14:20:00을 뜻하는지 14:20:59까지를 뜻하는지 정하지 않았다. 14:20:30에 기록된 revision이 찾아지는지가 달라진다.
    evidence: docs/PRD.md#d-과거-구성-확인; docs/decisions/0019-history-panel.md
    question: "'날짜로 찾기'에서 시각을 분 단위로 고를 때, 그 분 안에 기록된 revision을 포함할까요?"
    options:
      - id: A
        label: 그 분의 끝까지 포함
        detail: >-
          "오후 2:20"을 고르면 14:20:59.999 이하의 마지막 기록을 고른다. 행에 보이는 시각을 그대로 고르면 그 행(또는 같은 분의 더 늦은 기록)이 찾아진다.
          PRD의 "이하" 규칙을 분 단위 표시에 맞춰 해석한다. 비용 없음.
      - id: B
        label: 그 분의 시작(00초) 기준
        detail: >-
          "오후 2:20"을 14:20:00으로 보고 그 이하만 고른다. 글자 그대로의 해석이지만, 행에 "오후 2:20"으로 보이는 14:20:30 기록을 같은 시각으로 찾으면
          그 앞 기록이 나와 헷갈린다.
      - id: C
        label: 초 단위까지 고르게
        detail: >-
          시각 선택에 초를 더해 경계를 사용자가 정한다. 모호함은 없지만 선택 칸이 복잡해지고, 행 표시(분 단위)와 단위가 달라진다.
    recommended_default: A
    recommendation_rationale: >-
      행과 띠에 보이는 기록 시각이 분 단위이므로, 사용자가 본 시각을 그대로 고르면 그 기록이 나와야 자연스럽다. A는 PRD의 "이하" 규칙을 지키면서
      표시 단위와 선택 단위를 맞춘다. 순수 함수의 경계(정확히 같은 시각 포함)는 그대로이고, 분 → 시각 변환만 정하면 되어 되돌리기도 쉽다.
    answer: A
    answer_source: AskUserQuestion
