non_blocking_notes:
  - finding_id: F-W10-1
    task_id: W10
    note: The feature narrative (line 5) states that 새 Board 만들기 stays allowed while an archived Board is selected, but no scenario proves it. Read-only gating added in W10 could be applied too broadly (for example to every command while selectedBoardIsArchived) and no obligation would fail. 내보내기 does not exist yet (W24), so only Board 만들기 is testable now.
  - finding_id: F-W10-2
    task_id: W10
    note: Persistence failure and persistence across reopen are specified for 보관 but not for 보관 해제. The two transitions share the same store write, but a model that updates the list optimistically on 보관 해제 would not be caught.
  - finding_id: F-W10-3
    task_id: W10
    note: The scenario title promises state-dependent commands, but the steps only check that the three commands exist and that no delete command exists. The "only one of 보관/보관 해제 acts" behavior from the assumption, and the behavior when no Board is selected, have no observable step. The service-level idempotency scenario does not cover what the user sees when invoking "보관 해제" on an unarchived Board from the menu.
  - finding_id: F-W10-4
    task_id: W10
    note: The human decision is recorded correctly and applying it in W22 is reasonable, since checkpoints do not exist yet. However, no obligation or explicit carry-forward note in this run makes sure W22 picks it up. W22 does not currently cite 0005 or mention archived Boards, so the rule could be lost if decision promotion is skipped.
  - finding_id: F-W10-5
    task_id: W10
    note: The steps use internal cause and rejection identifiers, which matches earlier runs (0005 cause enum, W09 rejection vocabulary) and is acceptable at the service-test level. Keeping the first archivedAt on a repeated archive request is an author-chosen rule. It is reversible, invisible to the user, and does not change revision data, so it is acceptable as an assumption rather than a question.
