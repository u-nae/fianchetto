        detail: 보관 = 읽기 전용으로 단순하게 유지한다. 구성 편집과 체크포인트 저장을 모두 막고 조회·내보내기·새 Board 만들기만 허용한다. 체크포인트를 남기려면 보관을 해제한다. 나중에 허용으로 바꾸기 쉽다.
