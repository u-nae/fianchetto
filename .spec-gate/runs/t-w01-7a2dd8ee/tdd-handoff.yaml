non_blocking_notes:
  - finding_id: F-W01-1
    task_id: W01
    note: The work item scope includes a String Catalog and an OSLog subsystem definition, but no test obligation covers either. CLAUDE.md says TDD proceeds from the handoff's test obligations, so these two scope items could be silently dropped. This does not affect the A18 acceptance boundary.
  - finding_id: F-W01-2
    task_id: W01
    note: "\"strict concurrency complete\" is to be verified with xcodebuild -showBuildSettings. Under Swift 6 language mode, complete checking can apply without SWIFT_STRICT_CONCURRENCY being explicit, so the pass condition is ambiguous. The obligation also does not say which build configurations are checked. Xcode's default Release ARCHS is ARCHS_STANDARD (arm64 + x86_64), and A17 measurement uses Release builds, so checking Debug alone is not enough."
  - finding_id: F-W01-3
    task_id: W01
    note: The macOS App template's default sandbox entitlements include com.apple.security.files.user-selected.read-only. The obligation requires read-write to be present but does not require read-only to be absent. If both are declared, the user-selected file permission becomes ambiguous, which conflicts with 0001's decision of a single read-write entitlement.
  - finding_id: F-W01-4
    task_id: W01
    note: This source_ref is not used as the source of any obligation. It is reflected only in risk_signals (macOS 27 versus macOS 15 confusion) and in the reporting-separation text of W01-build-commands-recorded. The tool-version record is environment information, not a pass condition, so this is acceptable.
  - finding_id: F-W01-5
    task_id: W01
    note: The exclusion of network-client, screen-recording, and Accessibility entitlements is an agent-chosen default and is recorded as an assumption. It is consistent with PRD §8 (offline, no outbound transmission) and §4 exclusions. Opening a web link uses NSWorkspace, which needs no network entitlement, so this does not invent a new policy.
