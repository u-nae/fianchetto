non_blocking_notes:
  - finding_id: F-W06-10
    task_id: W06
    note: 기록 경로는 심볼릭 링크를 풀지 않는다고 정했지만 이를 검증하는 예시가 없어, 링크를 푸는 구현도 모든 시나리오를 통과한다. 또 북마크 해석 결과 URL은 보통 실제 경로(링크가 풀린 형태)다. 갱신 조건의 "생성 때의 경로"가 사용자가 고른 표기(링크 유지)라면 링크를 거쳐 고른 대상은 이동이 없어도 첫 해석마다 경로가 달라 보여 갱신 북마크가 나온다. 비교 기준(북마크에 담긴 경로인지, 호출자가 기록한 경로인지, 링크 해소 후 비교인지)이 정해져 있지 않다. 테스트 호스트가 sandbox 컨테이너 임시 디렉토리를 쓰면 경로에 링크가 없어 이 차이가 드러나지 않는다.
  - finding_id: F-W06-11
    task_id: W06
    note: 해석 옵션은 "보안 범위를 포함한다"만 고정한다. 분리된 볼륨(특히 네트워크 볼륨)의 북마크를 해석할 때 시스템이 마운트를 시도하거나 UI를 띄우지 않도록 하는 옵션(withoutUI, withoutMounting)을 쓰는지 정하지 않았다. 해석은 MainActor 밖에서 호출되므로 UI 표시 시도는 부적절하고, 자동 마운트 여부는 R1(volume_unavailable)에 도달하는지를 바꾼다.
  - finding_id: F-W06-12
    task_id: W06
    note: Feature는 POSIX ENOENT를 no_such_file로 매핑하지만 매니페스트 가정의 매핑 목록에는 ENOENT가 없다. 두 문서 중 하나만 읽으면 매핑 범위가 다르게 보인다. 시나리오가 obligation 기준이므로 동작은 정해져 있으나 근거 문서가 어긋난다.
  - finding_id: F-W06-13
    task_id: W06
    note: F-W06-6의 소유 경계는 가정으로 정리되었지만, 결정표 9조합을 그대로 반복하는 Outline이 남아 있고 이 Outline을 source로 가리키는 obligation이 없다(고아 시나리오). 결정표와 Outline을 함께 고쳐야 하는 유지 부담이 그대로다. 현재 두 산출물의 9행은 서로 일치한다.
  - finding_id: F-W06-14
    task_id: W06
    note: 패키지를 file로 보는 선택은 이력에 남는 Node 종류에 영향을 주지만 Finder 표시 관례와 PRD §5와 일관되고 되돌릴 수 있어 정책 질문이 필요하지 않다고 본다(pass 1 F-W06-8과 같은 판단을 독립적으로 재확인).
  - finding_id: F-W06-15
    task_id: W06
    note: 재실행 후 sandbox 접근과 실제 볼륨 분리는 이 항목의 단위 테스트로 증명할 수 없고, 같은 프로세스 내 해석과 주입한 시스템 어댑터가 대리 증거다. A02의 완전한 충족은 W08·W14·W15·W27에 달려 있다.
  - finding_id: F-W06-16
    task_id: W06
    note: 시작 실패 시에도 작업을 실행하는 선택은 기준 문서의 대응 규칙과 충돌하지 않고, 실제 접근 불가는 작업 오류로 드러나며 되돌리기 쉬운 구현 선택이다. 그 작업 오류를 W15 상태로 분류하는 경로는 이 항목의 오류 범주 매핑·결정표를 재사용할 수 있다.
