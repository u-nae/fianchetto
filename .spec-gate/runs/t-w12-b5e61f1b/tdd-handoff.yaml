non_blocking_notes:
  - finding_id: F-W12-7
    task_id: W12
    note: '"그 앞" 드롭 규칙에서는 그룹 "개발"을 자기 자식인 Bishop 파일 "설계 메모"(또는 자식 웹 링크) 위에 놓으면 목적 부모가 "개발" 자신이 된다. 이는 불변식 11의 "자신 안으로" 경우로, 도메인은 cycle로 거부하지만 화면 상태 모델이 드롭 위치에서 부모를 계산해 이 거부를 순환 안내로 보여 주는지는 어떤 시나리오도 고정하지 않는다. 그룹 대상 Examples만으로는 이 경로가 회귀해도 테스트가 실패하지 않는다. 결과(거부·안내·무기록)는 기존 규칙에서 바로 도출되므로 수용 경계를 바꾸지는 않는다.'
  - finding_id: F-W12-8
    task_id: W12
    note: '이미 그룹의 마지막 자식인 항목을 그 그룹 위에 놓는 경우(예: "하위"를 "개발" 위에)는 "그룹 위 = 그 안 끝" 규칙상 같은 위치이므로 무기록이어야 한다. 같은 위치 규칙에서 도출되고 W05 서비스의 무변경 판정이 이를 처리하므로 별도 요구하지 않는다. A14의 그룹 제거 범위 확인·제거 후 과거 구성 유지 조항은 W13(acceptance_refs [A14])이 담당하며 W12는 순환 조항을 증명한다.'
