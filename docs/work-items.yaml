  - id: W17
    title: 이력 목록과 날짜 시점 조회
    description: revision 목록을 순번 순서로 보여 주고 날짜·시각으로 당시의 마지막 기록을 찾는다.
    details: >-
      목록은 필요한 양만 로드하고 선택한 revision만 디코딩한다. 날짜 조회는 기록 시각이 지정 시각 이하인
      것 중 가장 늦은 시각, 같은 시각은 순번으로 결정(시계 역행 대응). 생성 이전은 "이 시점의 기록 없음".
      저장은 절대 시각, 표시·선택은 시스템 시간대. 실제 기록 시각을 함께 표시하고 매일 스냅샷처럼
      표현하지 않는다. 조회는 현재 구성을 바꾸지 않는다.
    test_strategy: >-
      시점 선택은 순수 함수 단위 테스트(경계: 정확히 같은 시각, 생성 이전, 시계 역행, 같은 시각 다른 순번).
      서비스 테스트: 페이지 로드 개수, 조회 후 현재 구성·revision 수 불변.
