  - id: W20
    title: 과거 구성으로 복원
    description: 차이를 먼저 보여 준 뒤 확정하면 과거 구성을 현재로 되돌리는 새 revision을 만든다.
    details: >-
      Board 이름과 Node 구성을 해당 시점으로 바꾸고 restoredFromRevisionID를 기록(0005). 기존 revision과
      체크포인트는 유지. 현재와 동일하면 revision을 만들지 않는다. 접근 불가 항목도 제외하지 않고 복원하며
      누락 상태와 해결 동작을 표시한다. 실제 파일·Git 상태는 건드리지 않는다. 보관된 Board에서는 거부.
    test_strategy: >-
      서비스 테스트: 복원 후 새 revision과 출처 ID, 기존 revision·체크포인트 수 유지, 동일 구성 무변경,
      대상이 삭제된 항목 포함 복원, 저장 실패 주입 시 이전 현재 구성 유지, 원본 파일 불변.
    status: pending
    priority: high
    dependencies: [W16, W17]
    source_refs:
      - docs/PRD.md#f-복원과-새-프로젝트-만들기
      - docs/decisions/0005-provenance-and-archive-fields.md
    acceptance_refs: [A08]
    subtasks: []

  - id: W21
    title: 과거 구성에서 새 Board 만들기
    description: 선택한 구성의 복사본과 새 이름으로 독립적인 새 Board를 만든다.
    details: >-
      프로젝트·Node에 새 UUID를 부여하고 부모 관계를 재매핑(순수 Domain 함수). 원본 프로젝트·revision을
      origin으로 기록(0005). 원본 이력·체크포인트는 복사하지 않고 새 Board의 첫 revision이 복사된 구성.
      보관된 Board에서도 허용. 정책 모호성: PRD는 "연결 참조는 같은 로컬 대상과 접근 정보를 사용할 수
      있다"고만 한다. 원본과 ResourceReference 레코드를 공유할지, 같은 북마크 데이터로 새 reference를
      만들지에 따라 한쪽의 북마크 갱신·대상 교체가 다른 Board에 영향을 주는지가 달라진다. 게이트가
      권장안과 함께 질문한다.
    test_strategy: >-
      Domain 단위 테스트: ID 재매핑 후 구조 동형, 원본과 겹치는 ID 없음. 서비스 테스트: 새 Board의
      revision 1개와 origin, 이후 원본 편집이 새 Board에 영향 없음(그 반대도).
    status: pending
    priority: high
    dependencies: [W17, W10]
    source_refs:
      - docs/PRD.md#f-복원과-새-프로젝트-만들기
      - docs/decisions/0005-provenance-and-archive-fields.md
    acceptance_refs: [A09]
    subtasks: []

  # ── 단계 4: 작업 맥락과 데이터 이동 ─────────────────────────────
  - id: W22
    title: 체크포인트 저장과 재개
    description: 고정한 revision에 제목·진행 메모·다음 할 일을 담은 불변 체크포인트를 저장하고 조회한다.
    details: >-
      작성 시작 시 연결할 revision을 고정하고 저장 전까지 구성 편집을 막는 시트. 제목 필수, 메모·다음 할
      일 선택. 입력 중에는 revision을 만들지 않고 기존 revision에 붙인다. 저장 후 불변, 같은 revision에
      여러 체크포인트 허용. 조회는 연결된 과거 구성을 읽기 전용으로 보여 주고 복원은 별도 동작. 웹 링크는
      revision 구성으로 참조(0002). 실패 시 부분 생성 없이 입력을 유지해 재시도. 로그에 메모 원문 금지.
      보관된 Board에서는 체크포인트 저장을 거부한다(0009).
    test_strategy: >-
      서비스 테스트: 저장 전후 revision 수 불변, 고정 revision 연결, 빈 제목 거부, 저장 실패 주입 시
      체크포인트 미생성, 같은 revision 다중 체크포인트. 화면 상태 테스트: 시트 동안 편집 비활성.
      XCUITest: 체크포인트 저장 후 조회.
    status: pending
    priority: high
    dependencies: [W18]
    source_refs:
      - docs/PRD.md#g-체크포인트-남기기와-재개
      - docs/decisions/0002-web-links-are-nodes.md
      - docs/decisions/0009-archived-board-read-only.md
    acceptance_refs: [A10]
    subtasks: []

  - id: W23
    title: 체크포인트 이미지 첨부
    description: 이미 있는 PNG/JPEG 파일을 골라 앱 저장소로 복사해 체크포인트에 첨부한다.
    details: >-
      읽기 전용으로 열어 앱 컨테이너로 복사(0001). staging 후 DB 저장 성공 시 확정, 실패 시 정리해 고아
      파일·부분 체크포인트를 남기지 않는다. PNG/JPEG만 허용(내용 기준 검증). 썸네일은 ImageIO로 크기 제한,
      MainActor 밖. 화면 기록 권한을 요청하지 않는다. 로그에 이미지 내용 금지. PRD §4에 따라 마지막
      단계에 구현할 수 있다.
    test_strategy: >-
      임시 디렉토리 서비스 테스트: 첨부 후 원본 삭제해도 조회 가능, 확장자 위장 파일 거부, DB 실패 주입 시
      staging 파일 정리·체크포인트 미생성, 원본 이미지 불변. entitlement·Info.plist에 화면 기록 권한 없음 확인.
    status: pending
    priority: low
    dependencies: [W22]
    source_refs:
      - docs/PRD.md#g-체크포인트-남기기와-재개
      - docs/PRD.md#첫-버전-필수
      - docs/TECH_STACK.md#저장-위치와-내보내기
      - docs/decisions/0001-sandbox-file-access.md
    acceptance_refs: [A11]
    subtasks: []

  - id: W24
    title: Board 내보내기
    description: Board 하나의 현재 구성·전체 revision·체크포인트·첨부를 사용자가 고른 폴더에 묶음으로 쓴다.
    details: >-
      폴더 묶음: manifest.json(schema version, Project·Node·Revision·Checkpoint·ResourceReference,
      origin·restoredFromRevisionID 포함)과 attachments/. ZIP 의존성 없음. 기록된 경로가 포함된다는 안내.
      연결 대상 내용과 북마크 권한에 의존하지 않는다. 쓰기 위치 접근은 저장 패널로 얻고 북마크로 저장하지
      않는다(0001). 보관된 Board도 허용. 실패 시 불완전한 묶음을 남기지 않는다.
      Node의 용도(purpose)도 manifest에 그대로 쓴다. 앱이 모르는 키도 보존한다(0021, W29).
    test_strategy: >-
      Domain manifest 인코딩 단위 테스트. 임시 디렉토리 서비스 테스트: 파일 구성, 첨부 바이트 일치,
      쓰기 실패 주입 시 대상 폴더 정리, 원본 대상 파일 불변.
    status: pending
    priority: medium
    dependencies: [W22]
    source_refs:
      - docs/PRD.md#i-내보내기가져오기
      - docs/TECH_STACK.md#저장-위치와-내보내기
      - docs/decisions/0001-sandbox-file-access.md
      - docs/decisions/0005-provenance-and-archive-fields.md
    acceptance_refs: [A15]
    subtasks: []

  - id: W25
    title: Board 가져오기
    description: 내보낸 묶음을 검증한 뒤 ID를 재매핑해 새 Board로 만든다.
    details: >-
      가져오기 전 검증: 지원 schema version, 구성 JSON 손상, 트리 규칙(W02), 현재 구성 포인터, 필수 첨부
      존재, 첨부 경로의 묶음 폴더 이탈 거부, origin 필드 형식(0005). 하나라도 실패하면 전체 중단, 기존
      데이터·원본 자료 변경 없음. 통과 시 Project·Node·Revision·Checkpoint·ResourceReference ID를
      재매핑하며 관계와 Node 이력상 동일성 유지, 원본 ID는 origin으로만 보존. 북마크 권한에 의존하지
      않고 로컬 대상을 재연결 필요 상태로 표시(경로 없음은 손상 아님).
      Node의 용도(purpose)를 그대로 옮긴다. 모르는 키는 보존하고, Wing·웹 링크의 용도는 purpose_not_allowed로 거부한다(0021, W29).
    test_strategy: >-
      Domain 검증·재매핑 단위 테스트(경계: 빈 이력, 첨부 0개, ../ 경로, 미지원 버전, 순환 트리).
      W24 출력으로 왕복 테스트해 이력·체크포인트·첨부·관계 보존. 손상 묶음별로 저장소 레코드 수 불변.
    status: pending
    priority: medium
    dependencies: [W24, W15]
    source_refs:
      - docs/PRD.md#i-내보내기가져오기
      - docs/TECH_STACK.md#저장-위치와-내보내기
      - docs/decisions/0005-provenance-and-archive-fields.md
    acceptance_refs: [A15, A16]
    subtasks: []

  # ── 단계 5: 실제 개인 사용 검증 ─────────────────────────────────
  - id: W26
    title: 성능 측정 데이터와 Release 측정
    description: 기준 규모의 데이터로 Release 빌드의 지연·자원 수치를 측정하고 오프라인 동작을 확인한다.
    details: >-
      검증 데이터 생성기(프로젝트 10개, 선택 프로젝트 Node 500개 중 그룹 50개, revision 1,000개, 결정적
      시드). Release + Instruments로 시작 시간, 유휴 CPU·메모리, revision 저장 지연, 과거 구성 표시,
      비교 시간, DB·첨부 크기를 기록한다. 정량 목표는 이 측정 후 정한다(측정 전 수치 약속 없음).
      네트워크 차단 상태에서 조회·비교·복원.
    test_strategy: >-
      데이터 생성기는 결정적 출력 단위 테스트. 측정은 Release 빌드 Instruments 수동 수행 후 결과 문서화.
      모든 revision을 디코딩하지 않는지 디코딩 횟수 계측 테스트.
    status: pending
    priority: medium
    dependencies: [W19, W20]
    source_refs:
