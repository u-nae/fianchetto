      과거 revision 대 현재 비교를 빠른 동작으로 제공하고, 임의의 두 revision도 선택할 수 있다. W16 결과를
      종류별로 표시하고 변화 없음은 명확한 빈 상태. 파일 시스템·네트워크 없이 동작한다.
    test_strategy: >-
      서비스 테스트: 두 revision 로드 후 비교 결과, 파일 시스템 어댑터 실패 주입 상태에서도 비교 성공.
      화면 상태 테스트: 빈 상태 표시.
    status: pending
    priority: high
    dependencies: [W16, W17]
    source_refs:
