  - id: W15
    title: 연결 상태 표시와 재연결
    description: 연결 대상의 상태를 구분해 표시하고 같은 대상의 접근 복구 또는 다른 대상 선택을 제공한다.
    details: >-
      상태: 정상, 권한 필요, 대상 없음, 볼륨 연결 필요, 확인 실패. 근거가 부족하면 확인 실패.
      선택·열기·명시적 새로고침 때만 확인하고 상시 감시하지 않는다. 오류 항목은 트리에 남기고
      "다시 선택"·"상태 새로고침" 제공. 같은 대상 권한 복구·stale 북마크 갱신은 revision을 만들지
      않고, 다른 대상이면 W09 교체로 처리. 상태는 색상만으로 구분하지 않는다.
    test_strategy: >-
      상태 분류는 입력(해석 결과·오류)을 받는 순수 함수 단위 테스트. 서비스 테스트: 임시 디렉토리 대상
      삭제 후 Node·이력 유지와 "대상 없음", 같은 대상 재선택 시 revision 불변, 다른 대상은 새 reference.
      볼륨 분리는 W27 실제 환경 검증.
