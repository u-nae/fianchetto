  # W28은 사용자 결정(0020)으로 추가했고 W17보다 먼저 진행한다. ID는 기존 번호를 바꾸지 않으려고 뒤에서 붙였다.
  - id: W28
    title: 아이콘 보기와 Wing 단위 탐색
    description: 구성 영역을 목록(트리) 보기와 아이콘 보기 중에서 고를 수 있게 하고, 아이콘 보기는 Wing 한 단계씩 탐색한다.
    details: >-
      보기 메뉴 아이콘(⌘1)·목록(⌘2)과 툴바 세그먼트로 전환한다(기본 목록, 마지막 보기 기억). 아이콘 보기는 현재 위치(최상위 또는 Wing)
      한 단계의 항목을 구성 순서대로 격자로 보이고, Wing 이중 클릭·⌘↓로 들어가며 ⌘↑·뒤로(⌘[)·경로 막대로 돌아간다. Bishop·웹 링크
      이중 클릭·⌘↓는 열기(W14)다. Wing 타일 위에 놓으면 그 안 끝으로 옮기고(W12 규칙, revision 하나), 빈 곳·빈 Wing 화면에는 Finder 파일만 받아 지금 위치 끝에 연결한다.
      타일 사이 순서 바꾸기는 첫 버전에서 빼고 위로·아래로 이동(⌥⌘↑↓)을 쓴다. 선택·메뉴·키보드·VoiceOver는 목록 보기와 같은 명령을 쓴다.
      연결 상태(W15)는 기호와 문구로 함께 표시한다. 보기 방식(Board별, 다시 실행해도 기억)과 현재 위치(화면 세션)는 화면 설정이며 revision을 만들지 않는다. 설정의 '파일 종류 아이콘'
      모드(기록 당시 경로 확장자 기준 일반 아이콘 + Bishop 배지)를 포함하며, 타일·행 기호는 디스크에 접근하지 않는다(실제 파일 아이콘 금지).
      보관된 Board에서는 탐색·열기만 하고 편집을 막는다(0009). 시각 명세는 DESIGN.md 17장·18.5.
    test_strategy: >-
      화면 상태 모델 테스트: 보기 전환·위치 이동(들어가기·위로·경로·없어진 Wing·Board 전환), 위치별 항목 순서, 드롭 결과와 revision,
      열기 위임, 보관 차단, 설정 기억. UI 테스트는 전환과 Wing 들어가기·나오기 핵심 흐름만.
    status: done
    priority: high
    dependencies: [W12, W14, W15]
    source_refs:
