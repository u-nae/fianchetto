    details: >-
      "Bishop 제거"·그룹 제거는 현재 구성에서만 Node를 없애고 디스크 대상을 삭제하지 않는다. 그룹과
      자손 제거는 revision 하나. 확인 취소는 무변경. 과거 revision에는 제거된 항목이 남는다. 화면에
