      변경. 한 Node의 여러 변화를 함께 보고하고 변경 전·후 이름·그룹 위치·대상 경로를 제공한다. 직접 부모가
      그대로인 자손은 이동으로 세지 않는다. 앞쪽 삽입으로 인덱스만 밀린 형제는 재정렬로 표시하지 않는다.
