    acceptance_refs: [A05]
    subtasks: []

  - id: W18
    title: 과거 구성 읽기 전용 보기와 당시 대상 열기
    description: 선택한 revision의 구성을 읽기 전용으로 보여 주고, 과거 항목을 열 때 현재와 혼동하지 않게 한다.
    details: >-
      "과거 구성 · 읽기 전용"과 기록 시각을 표시(색상만으로 구분하지 않음). 과거 항목 열기는 그 reference가
      현재 해석하는 대상을 열고, recordedPath와 현재 위치가 다르면 둘을 구분해 표시(0003). 실제 파일
      내용은 현재 내용이라는 설명 제공. 과거 화면 재연결은 같은 대상 접근 복구만 허용하고 다른 대상으로
      덮어쓰지 않는다. 당시 존재 여부를 증명하지 않는다.
      과거 구성의 Bishop 용도 배지는 당시 값으로 보이고, "아이콘" 고르는 곳 세 곳은 모두 꺼진다(0021, W29).
    test_strategy: >-
      화면 상태 테스트: 편집 동작 비활성, 경로 차이 표시 판정, 대상 교체 이후 과거 항목이 이전 reference를
      여는지(어댑터 주입). 과거 화면에서 다른 대상 재연결 거부.
    status: done
    priority: high
    dependencies: [W09, W15, W17]
    source_refs:
