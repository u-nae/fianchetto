    acceptance_refs: [A17]
    subtasks: []

  - id: W27
    title: Release 실사용 검증과 최소 OS 호환성 보고
    description: Release 앱으로 대표 시나리오와 실제 환경 항목을 검증하고 결과를 보고한다.
    details: >-
      대표 시나리오(PRD §2) 수행, 재실행 후 sandbox 파일 접근, 파일 이동·삭제, 외장 볼륨 분리, 권한
      재요청, Finder 열기, 키보드 접근, macOS 15 실기 실행. 수행하지 못한 항목은 미검증으로 명시한다.
      개발 기기 macOS 27 통과를 macOS 15 통과로 보고하지 않는다.
    test_strategy: >-
      체크리스트 기반 수동 검증과 결과 문서(빌드 성공·테스트 통과·실제 환경 확인 구분). 가능한 범위는
      XCUITest 대표 시나리오로 자동화한다.
    status: pending
    priority: medium
