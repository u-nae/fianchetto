      - docs/PRD.md#h-연결-오류와-재연결
      - docs/decisions/0003-snapshot-records-paths.md
    acceptance_refs: [A06]
    subtasks: []

  - id: W19
    title: 구성 비교 화면
    description: 같은 Board의 두 revision 또는 과거와 현재를 비교해 보여 준다.
