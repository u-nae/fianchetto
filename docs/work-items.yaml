  - id: W12
    title: 그룹 이동과 형제 순서 변경
    description: 앱 내부 드래그·메뉴로 Node를 다른 그룹으로 옮기거나 형제 순서를 바꾼다.
    details: >-
      논리적 배치만 바꾸고 실제 파일을 이동하지 않는다. 자신이나 자손 안으로 그룹 이동, 연결 폴더 안으로
      이동을 거부한다. 드롭 완료 하나가 revision 하나, 드래그 중간 상태는 기록하지 않는다. 같은 위치
      드롭은 무변경. 키보드·메뉴로도 이동할 수 있어야 한다.
    test_strategy: >-
      서비스 테스트: 이동·순서 변경 revision과 과거 배치 불변, 순환 이동 거부 시 구성·revision 불변,
      같은 위치 무변경, 원본 파일 경로 불변.
    status: done
    priority: high
