      - docs/TECH_STACK.md#ui-구성
      - docs/DESIGN.md
    acceptance_refs: [A04, A02]
    subtasks: []

  # W29도 사용자 결정(0021·0022)으로 추가했다. 순서: W28 → W29 → W17.
  - id: W29
    title: Bishop 용도 아이콘
    description: Bishop마다 용도(문서·데이터·이미지·코드·참고·할 일 등)를 골라 미트라에 용도 배지로 표시하고, 구성 이력에 남긴다.
    details: >-
      용도는 Bishop(파일·폴더) Node의 선택 속성이며 Wing·웹 링크에는 없다. 안정적인 영문 키로 저장하고 화면 문구·기호는 DESIGN.md 18장을 따른다.
      바꾸면 편집 연산 하나·revision 하나(원인 "아이콘 변경")이고, 같은 값이면 무변경이다. 과거 구성·비교(W16 분류 추가)·복원·새 Board·
      내보내기에 함께 따라간다. 스냅샷은 기존 저장 위치(JSON)에 선택 필드로 더해 기존 revision을 그대로 읽는다. 보관된 Board에서는 바꿀 수 없다(0009).
      목록·아이콘 보기 모두에 배지를 보인다.
    test_strategy: >-
      Domain: 용도 변경 연산(무변경·비 Bishop 거부·알 수 없는 키 거부), 스냅샷 왕복과 기존 형식 읽기, W16 차이 분류.
      서비스·화면 상태: revision 하나와 원인, 저장 실패, 보관 차단, 메뉴·오른쪽 클릭 진입점.
    status: done
    priority: high
