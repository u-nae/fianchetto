schema_version: "1.0"
# 구현 순서는 PRD §10 단계 1~5를 따르고 dependencies로 표현한다.
# 기능 항목(W07 이후)은 Service + 화면 상태 + View/메뉴 명령을 함께 포함한다.
items:
  # ── 단계 1: 데이터와 파일 접근 기반 ─────────────────────────────
  - id: W01
    title: 앱 프로젝트와 빌드·샌드박스 기반 만들기
    description: 표준 .xcodeproj 앱 target과 테스트 target을 만들고 빌드 기준을 고정한다.
    details: >-
      macOS App 템플릿, Swift 6 language mode, strict concurrency complete, deployment target macOS 15.0,
      arm64, 외부 패키지 0개. App Sandbox entitlement는 user-selected read-write와 app-scoped bookmarks(0001).
      CLAUDE.md 구조의 폴더(App/Features/Services/Domain/Persistence/Platform), Swift Testing 단위 테스트
      target, XCUITest target, String Catalog, OSLog 서브시스템 정의. 실제 scheme 이름으로 CLAUDE.md의
      빌드·테스트 명령을 고정한다. 기능 코드는 넣지 않는다.
    test_strategy: >-
      xcodebuild build와 test가 경고 0개로 통과하는지 확인한다. 빌드 설정(SWIFT_VERSION, 동시성 검사,
      MACOSX_DEPLOYMENT_TARGET, ARCHS)과 entitlement plist를 검사한다. 앱이 실행되어 빈 창을 띄우는지
      launch check. macOS 15 실기 검증은 W27에서 별도로 보고한다.
    status: done
    priority: high
    dependencies: []
    source_refs:
      - docs/TECH_STACK.md#확정-기술스택
      - docs/TECH_STACK.md#현재-로컬-도구-기준
      - docs/TECH_STACK.md#구조와-경량화-원칙
      - docs/PRD.md#단계-1-데이터와-파일-접근-기반
      - docs/decisions/0001-sandbox-file-access.md
    acceptance_refs: [A18]
    subtasks: []

  - id: W02
    title: 구성 스냅샷 값 타입과 트리 규칙
    description: Revision에 저장할 불변 구성 스냅샷과 트리 유효성 규칙을 순수 Swift로 정의한다.
    details: >-
      Domain 값 타입: 프로젝트 이름과 Node 목록(UUID, 종류 group/file/folder/webLink, 표시 이름, 부모 ID,
      정렬 순서, referenceID·recordedPath·대상 종류(file/folder), url(webLink)). Codable JSON schema
      version 1(0002, 0003). 검증 규칙: 순환 없음, 부모 하나, 연결 폴더·파일·웹 링크는 부모가 될 수 없음,
      빈 이름 거부·앞뒤 공백 정리, 같은 부모 아래 같은 이름 허용, webLink는 HTTP/HTTPS 절대 URL,
      종류별 필드 일관성. Foundation만 import한다.
    test_strategy: >-
      Swift Testing 단위 테스트: JSON 왕복 동일성, schema version 기록, 각 위반 규칙의 거부와 경계값
      (공백만 있는 이름, 자기 자신을 부모로, 깊은 자손 순환, 빈 트리, http 외 scheme).
    status: done
    priority: high
    dependencies: [W01]
    source_refs:
      - docs/PRD.md#5-핵심-개념과-데이터-규칙
      - docs/PRD.md#불변식
      - docs/TECH_STACK.md#주요-개념
      - docs/TECH_STACK.md#저장-방식
      - docs/decisions/0002-web-links-are-nodes.md
      - docs/decisions/0003-snapshot-records-paths.md
    acceptance_refs: [A14]
    subtasks: []

  - id: W03
    title: 구성 편집 연산과 무변경 판정
    description: 확정된 사용자 작업 하나를 스냅샷에서 새 스냅샷으로 바꾸는 순수 연산과 무변경 판정을 만든다.
    details: >-
      연산: 프로젝트 이름 변경, 그룹 추가, 연결 항목 여러 개 일괄 추가, 웹 링크 추가, 표시 이름 변경,
      URL 변경, 부모 이동, 형제 순서 변경, Node와 자손 제거, 대상 교체(새 referenceID·recordedPath).
      모든 연산은 Node UUID를 유지하고 이름·경로가 같아도 병합하지 않는다. 결과가 입력과 같으면
      "변경 없음"을 반환해 revision을 만들지 않게 한다. 유효하지 않은 입력은 오류로 거부한다(W02 규칙).
      UUID 생성은 주입한다. 대상 동일성 판정 함수(0004: fileResourceIdentifier+volumeIdentifier,
      같음/다름/판정 불가)도 이 항목에 순수 함수로 둔다.
    test_strategy: >-
      Swift Testing: 연산별 결과 스냅샷, UUID 유지, 대상 교체 시 새 referenceID와 원래 스냅샷 불변,
      같은 값 확정·같은 위치 이동의 무변경 판정, 순환 이동 거부, 동일성 판정 세 경우.
    status: done
    priority: high
    dependencies: [W02]
    source_refs:
      - docs/PRD.md#불변식
      - docs/PRD.md#7-기록-정책과-저장-안정성
      - docs/PRD.md#b-backend-대상-교체
      - docs/decisions/0004-same-target-identity.md
    acceptance_refs: [A03, A04]
    subtasks: []

  - id: W04
    title: SwiftData 스키마 V1과 저장소 열기
    description: 영구 저장 모델 V1과 마이그레이션 계획을 만들고, 저장소를 열 수 없을 때 안전하게 실패한다.
    details: >-
      @Model: Project(id, createdAt, currentRevisionID, archivedAt?, origin?), ResourceReference(id,
      최초 경로, 대상 종류, 북마크 데이터, 마지막 해석 경로), Revision(projectID, sequence, recordedAt,
      cause, restoredFromRevisionID?, 프로젝트 이름, 구성 JSON, JSON schema version), Checkpoint(revisionID, 제목,
      진행 메모, 다음 할 일, 첨부 참조)(0005). 현재 구성은 currentRevisionID가 가리키는 스냅샷이며 Node 레코드는 없다(0007). VersionedSchema V1 + SchemaMigrationPlan. 경계에서
      Domain 값 타입으로 변환하고 @Model은 Persistence 밖으로 내보내지 않는다. 저장소 열기 실패 시
      오류를 반환하고 빈 저장소로 교체하지 않는다. 저장소 위치는 Application Support.
    test_strategy: >-
      임시 디렉토리 ModelContainer로 저장·재오픈 후 값 보존, Domain 변환 왕복, 손상·접근 불가 저장소
      열기 실패가 오류로 드러나고 기존 파일이 남는지 확인. 스키마 이전은 테스트 전용 V2 스키마로
      V1 데이터가 유지되는지 검증한다.
    status: done
    priority: high
    dependencies: [W02]
    source_refs:
      - docs/TECH_STACK.md#주요-개념
      - docs/TECH_STACK.md#확정-기술스택
      - docs/TECH_STACK.md#저장-위치와-내보내기
      - docs/PRD.md#7-기록-정책과-저장-안정성
      - docs/decisions/0005-provenance-and-archive-fields.md
      - docs/decisions/0007-current-configuration-is-revision-pointer.md
    acceptance_refs: [A18]
    subtasks: []

  - id: W05
    title: 구성 변경 커밋 서비스와 Board 만들기
    description: 현재 구성과 revision을 한 저장 단위로 커밋하는 서비스를 만들고 첫 사용처로 Board 생성을 제공한다.
    details: >-
      서비스는 W03 연산 결과를 받아 현재 구성 갱신과 revision 추가(프로젝트별 증가 순번, 절대 시각,
      cause)를 한 번에 저장한다. 실패 시 이전 성공 구성으로 되돌리고 성공 전에는 완료를 알리지 않는다.
      같은 프로젝트의 인접 요청은 직렬화해 순번 중복·누락을 막는다. 무변경 결과는 저장하지 않는다.
      보관된 프로젝트의 편집을 거부한다(0005). Board 만들기는 빈 초기 구성의 첫 revision을 기록하고
      실제 디렉토리를 만들지 않는다. 시간·UUID는 주입한다. 저장 실패 지점은 주입 가능하게 둔다.
    test_strategy: >-
      실제 in-memory/임시 디렉토리 SwiftData로: 생성 후 첫 revision 순번 1, 주입 실패 시 현재 구성·
      revision 모두 이전 상태, 동시 요청 직렬화 후 순번 연속, 무변경 시 revision 수 불변, 보관 프로젝트
      편집 거부, 생성 과정에서 파일 시스템에 디렉토리가 생기지 않음.
    status: done
    priority: high
    dependencies: [W03, W04]
    source_refs:
      - docs/PRD.md#7-기록-정책과-저장-안정성
      - docs/PRD.md#a-프로젝트와-연결-만들기
      - docs/TECH_STACK.md#저장-방식
      - docs/decisions/0005-provenance-and-archive-fields.md
    acceptance_refs: [A01, A13]
    subtasks: []

  - id: W06
    title: 읽기 전용 보안 범위 북마크 어댑터
    description: 사용자가 고른 파일·폴더의 읽기 전용 북마크를 만들고 재실행 후 해석해 접근한다.
    details: >-
      Platform 어댑터: NSOpenPanel 선택 결과에서 .withSecurityScope + .securityScopeAllowOnlyReadAccess
      북마크 생성(0001), 해석, stale 시 갱신(구성 이력과 분리, ResourceReference만 갱신),
      start/stopAccessingSecurityScopedResource 대응, fileResourceIdentifier·volumeIdentifier 조회(0004),
      접근 결과를 원인별로 반환. 파일 I/O는 MainActor 밖에서 한다. 원본을 쓰지 않는다.
    test_strategy: >-
      테스트마다 임시 디렉토리를 만들어 북마크 생성·해석·이동 후 해석·삭제 후 실패 원인을 검증한다.
      읽기 전용 옵션 사용을 검증한다. 실제 sandbox 재실행 접근은 W27에서 Release 앱으로 확인한다.
    status: done
    priority: high
    dependencies: [W01]
    source_refs:
      - docs/TECH_STACK.md#파일-접근과-권한
      - docs/PRD.md#단계-1-데이터와-파일-접근-기반
      - docs/decisions/0001-sandbox-file-access.md
      - docs/decisions/0004-same-target-identity.md
    acceptance_refs: [A02]
    subtasks: []

  - id: W07
    title: 기본 창과 Board 탐색
    description: Board 목록, 현재 구성 트리, 상세 영역을 가진 기본 창과 메뉴 명령을 만든다.
    details: >-
      NavigationSplitView(왼쪽 Board 목록·Board 만들기·보관된 Board 접근, 중앙 현재 구성 트리,
      Inspector 상세). 첫 실행 빈 목록과 "Board 만들기" 동작. 재실행 시 마지막 Board로 돌아가되 현재
      구성으로 진입(@AppStorage). Commands와 키보드 접근, 접근성 레이블, 문자열은 String Catalog
      (0006 용어). 화면 상태는 @Observable @MainActor. 이후 기능 항목이 이 창에 동작을 추가한다.
      저장소를 열 수 없으면(W04 원인 범주 accessDenied·damaged·incompatible·unavailable) 빈 창 대신 오류와 복구 선택지를
      보여 주고, 빈 저장소로 조용히 바꾸지 않는다(PRD §7). 선택지의 구체 내용은 이 항목의 게이트에서 정한다.
    test_strategy: >-
      화면 상태 단위 테스트(선택·마지막 Board 복원·빈 상태·저장소 열기 실패 상태). XCUITest 핵심 흐름: 첫 실행에서 Board를
      만들고 트리에 표시되는지, 메뉴·키보드로 같은 동작이 가능한지.
    status: done
    priority: high
    dependencies: [W05]
    source_refs:
      - docs/PRD.md#기본-창
      - docs/PRD.md#7-기록-정책과-저장-안정성
      - docs/PRD.md#ui-언어와-전달
      - docs/TECH_STACK.md#ui-구성
      - docs/decisions/0006-board-and-bishop-terms.md
    acceptance_refs: [A01]
    subtasks: []

  - id: W08
    title: 로컬 파일·폴더를 Bishop으로 연결하기
    description: 파일 선택이나 Finder 드롭으로 여러 파일·폴더를 한 작업으로 Board에 연결한다.
    details: >-
      선택한 대상마다 ResourceReference와 file/folder Node를 만들고 초기 표시 이름은 대상 이름. 여러 개
      추가와 한 번의 드롭은 revision 하나. 일부 북마크 생성 실패 시 전체 추가를 취소하고 재시도 가능하게
      한다. 선택 취소는 revision을 만들지 않는다. 외부 파일을 그룹에 드롭하면 연결 추가, 연결 폴더 위
      드롭은 거부. 원본을 이동·복사하지 않는다. 메뉴 "Bishop 추가".
    test_strategy: >-
      서비스 테스트(임시 디렉토리 + 실제 SwiftData): 여러 대상 추가 시 revision 1개와 recordedPath 기록,
      한 개 북마크 실패 주입 시 Node·revision·reference 모두 미생성, 취소 시 무변경, 원본 파일 상태
      불변. 드롭 대상 판정은 단위 테스트.
    status: done
    priority: high
    dependencies: [W06, W07]
    source_refs:
      - docs/PRD.md#a-프로젝트와-연결-만들기
      - docs/PRD.md#c-배치와-제거
      - docs/TECH_STACK.md#파일-접근과-권한
    acceptance_refs: [A02]
    subtasks: []

  - id: W09
    title: 연결 대상 변경
    description: Bishop의 이름·ID·배치를 유지하면서 실제 대상을 다른 파일·폴더로 바꾼다.
    details: >-
      다른 대상을 고르면 기존·새 경로를 보여 주고 확정 시 새 ResourceReference와 대상 교체 revision 하나를
      기록한다. 취소·같은 대상 재선택은 revision을 만들지 않는다. 동일성은 0004 판정을 쓰고 판정 불가면
      확정 전에 교체로 기록된다고 알린다. 이전 reference는 과거 revision이 참조하는 동안 보존한다.
    test_strategy: >-
      서비스 테스트: 교체 후 Node UUID·이름·부모·순서 유지, 새 referenceID, 이전 revision 스냅샷은
      기존 referenceID·recordedPath 유지, 같은 대상 재선택 무변경, 판정 불가 경로의 사용자 고지 상태.
    status: done
    priority: high
    dependencies: [W08]
    source_refs:
      - docs/PRD.md#b-backend-대상-교체
      - docs/PRD.md#불변식
      - docs/decisions/0004-same-target-identity.md
    acceptance_refs: [A03]
    subtasks: []

  # ── 단계 2: 구성 관리 ───────────────────────────────────────────
  - id: W10
    title: Board 이름 변경·보관·보관 해제
    description: Board 이름을 바꾸면 revision을 남기고, 보관·보관 해제는 구성 이력 없이 편집 가능 여부만 바꾼다.
    details: >-
      이름 변경은 구성 변경(revision). 보관은 archivedAt만 바꾸고 revision을 만들지 않는다(0005).
      보관된 Board는 편집을 막고 조회·내보내기·새 Board 만들기는 허용한다. 영구 삭제는 제공하지 않는다.
      정책 모호성: 보관된 Board에서 체크포인트 저장을 허용할지 PRD가 정하지 않았다(§6-C는 "편집"만
      막음). 게이트가 권장안과 함께 질문한다.
    test_strategy: >-
      서비스 테스트: 이름 변경 revision 1개, 같은 이름·공백만 변경 무변경, 보관·해제 시 revision 수 불변,
      보관 중 구성 편집 거부, 보관 중 조회 가능.
    status: done
    priority: medium
    dependencies: [W07]
    source_refs:
      - docs/PRD.md#첫-버전-필수
      - docs/PRD.md#c-배치와-제거
      - docs/decisions/0005-provenance-and-archive-fields.md
    acceptance_refs: [A04]
    subtasks: []

  - id: W11
    title: 그룹과 웹 링크 만들기, 이름·URL 편집
    description: 중첩 가상 그룹과 웹 링크를 만들고 Node 표시 이름과 웹 링크 URL을 편집한다.
    details: >-
      그룹은 실제 경로가 없고 디렉토리를 만들지 않는다. 웹 링크는 이름과 HTTP/HTTPS URL, 프리뷰를
      가져오지 않는다(0002). 이름 편집 확정·URL 변경마다 revision 하나, 입력 중간 상태·같은 값 확정·
      유효하지 않은 입력은 기록하지 않는다. 웹 링크 열기는 기본 브라우저(W14).
    test_strategy: >-
      서비스 테스트: 중첩 그룹 생성 revision, 웹 링크 URL 검증 거부 시 무변경, 이름 변경 후 과거
      revision 표시 이름 불변, 같은 값 확정 무변경. XCUITest: 그룹 만들고 이름 변경.
    status: done
    priority: high
